<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager</title>
<meta name="description" content="Aplicație desktop gratuită pentru gestionarea proiectelor de producție video — proiecte, clienți, etape de lucru, totul local pe laptopul tău.">
<link rel="icon" href="../icon/icon.svg" type="image/svg+xml">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#101218; --bg-elevated:#171A22; --panel:#1B1F29; --panel-2:#21252F;
    --border:#2A2F3B; --text:#ECEEF1; --text-muted:#9199A8; --text-faint:#626A79;
    --tally:#E8483C; --tally-dim:#4A2622; --scope:#35D6BE; --scope-dim:#143A35;
    --amber:#E8A33D; --violet:#8B7CF6;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    background-image:
      radial-gradient(circle at 10% -10%, rgba(53,214,190,0.08), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(232,72,60,0.07), transparent 35%);
    background-attachment:fixed;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; margin:0;}
  a{color:inherit;}
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px;}

  header{
    position:sticky; top:0; z-index:10;
    background:rgba(16,18,24,0.82); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600;}
  .brand-mark{
    width:28px; height:28px; border-radius:7px;
    background:linear-gradient(135deg, var(--tally), var(--scope));
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#0d0f14; font-size:13px;
  }
  .lang-switch{display:flex; gap:4px;}
  .lang-btn{
    background:none; border:1px solid var(--border); color:var(--text-faint);
    border-radius:6px; padding:5px 10px; font-size:11px; font-family:var(--font-mono); cursor:pointer;
  }
  .lang-btn.active{border-color:var(--scope); color:var(--scope);}

  .hero{padding:90px 0 60px; text-align:center;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px;
    color:var(--scope); border:1px solid var(--scope-dim); background:var(--scope-dim);
    padding:6px 14px; border-radius:100px; margin-bottom:22px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--tally);}
  .hero h1{font-size:clamp(32px,5vw,54px); line-height:1.08; max-width:820px; margin:0 auto;}
  .hero h1 .accent{background:linear-gradient(90deg, var(--tally), var(--amber), var(--scope)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{color:var(--text-muted); font-size:16px; max-width:560px; margin:20px auto 0; line-height:1.6;}

  .cta-row{display:flex; gap:12px; justify-content:center; margin-top:34px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:9px; font-weight:600; font-size:14px;
    text-decoration:none; border:1px solid var(--border); transition:transform .1s ease, border-color .1s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--scope); border-color:var(--scope); color:#0A1613;}
  .btn-secondary{background:var(--panel-2); color:var(--text);}
  .btn-secondary:hover{border-color:#3A4150;}

  /* signature element: pipeline strip echoing the in-app stage tracker */
  .pipeline-strip{
    max-width:760px; margin:56px auto 0; display:flex; gap:3px;
  }
  .pipeline-strip span{flex:1; height:6px; border-radius:3px;}
  .pipeline-strip span:nth-child(1){background:var(--scope);}
  .pipeline-strip span:nth-child(2){background:var(--scope);}
  .pipeline-strip span:nth-child(3){background:var(--scope);}
  .pipeline-strip span:nth-child(4){background:var(--amber); box-shadow:0 0 0 3px rgba(232,163,61,0.15);}
  .pipeline-strip span:nth-child(5){background:var(--border);}
  .pipeline-strip span:nth-child(6){background:var(--border);}
  .pipeline-strip span:nth-child(7){background:var(--border);}
  .pipeline-labels{
    max-width:760px; margin:8px auto 0; display:flex; justify-content:space-between;
    font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase;
  }

  section{padding:64px 0;}
  .section-title{text-align:center; margin-bottom:40px;}
  .section-title h2{font-size:26px;}
  .section-title p{color:var(--text-muted); margin-top:8px; font-size:14px;}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .feature{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px;
  }
  .feature .icon{font-size:22px; margin-bottom:12px;}
  .feature h3{font-size:15px; margin-bottom:8px;}
  .feature p{color:var(--text-muted); font-size:13px; line-height:1.55; margin:0;}

  .platforms{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .platform-card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:26px;
    display:flex; flex-direction:column; gap:14px;
  }
  .platform-card .plat-name{font-family:var(--font-display); font-size:18px; font-weight:600; display:flex; align-items:center; gap:10px;}
  .platform-card .plat-file{font-family:var(--font-mono); font-size:12px; color:var(--text-faint);}

  footer{border-top:1px solid var(--border); padding:34px 0; text-align:center; color:var(--text-faint); font-size:12.5px;}
  footer a{color:var(--scope); text-decoration:none;}

  @media(max-width:760px){
    .grid{grid-template-columns:1fr;}
    .platforms{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="brand"><div class="brand-mark">G</div> GDC Production Manager</div>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ro">RO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
  </div>
</header>

<section class="hero wrap">
  <div class="eyebrow"><span class="dot"></span> <span data-t="eyebrow"></span></div>
  <h1 data-t="hero_title"></h1>
  <p data-t="hero_sub"></p>
  <div class="cta-row">
    <a class="btn btn-primary" href="https://github.com/gordasgdc/gdc-production-manager/releases/latest" data-t="cta_download"></a>
    <a class="btn btn-secondary" href="https://github.com/gordasgdc/gdc-production-manager" data-t="cta_source"></a>
  </div>

  <div class="pipeline-strip">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="pipeline-labels" id="pipeline-labels"></div>
</section>

<section class="wrap">
  <div class="section-title">
    <h2 data-t="features_title"></h2>
    <p data-t="features_sub"></p>
  </div>
  <div class="grid" id="features-grid"></div>
</section>

<section class="wrap">
  <div class="section-title">
    <h2 data-t="download_title"></h2>
    <p data-t="download_sub"></p>
  </div>
  <div class="platforms">
    <div class="platform-card">
      <div class="plat-name">🍎 macOS</div>
      <div class="plat-file">GDCProductionManager.pkg</div>
      <p data-t="mac_hint" style="color:var(--text-muted); font-size:13px; margin:0;"></p>
      <a class="btn btn-secondary" href="https://github.com/gordasgdc/gdc-production-manager/releases/latest" data-t="cta_download"></a>
    </div>
    <div class="platform-card">
      <div class="plat-name">🪟 Windows</div>
      <div class="plat-file">GDCProductionManager.exe</div>
      <p data-t="win_hint" style="color:var(--text-muted); font-size:13px; margin:0;"></p>
      <a class="btn btn-secondary" href="https://github.com/gordasgdc/gdc-production-manager/releases/latest" data-t="cta_download"></a>
    </div>
  </div>
</section>

<footer class="wrap">
  <div data-t="footer_line"></div>
  <div style="margin-top:8px;">
    <a href="https://github.com/gordasgdc">GitHub</a> ·
    <a href="https://web.facebook.com/cristiGDC">Facebook</a> ·
    <a href="https://www.youtube.com/@cristigordas">YouTube</a>
  </div>
</footer>

<script>
const DOCS_TRANSLATIONS = {
  ro: {
    eyebrow: "Rulează 100% local, pe laptopul tău",
    hero_title: 'Gestionează-ți proiectele video <span class="accent">de la planificare la predare</span>',
    hero_sub: "Aplicație desktop gratuită, pentru un singur profesionist sau pentru orice echipă. Fiecare instalare are datele ei, stocate local, fără cloud și fără abonament.",
    cta_download: "Descarcă ultima versiune",
    cta_source: "Cod sursă (GitHub)",
    features_title: "Construită pentru fluxul real de producție video",
    features_sub: "De la primul apel cu clientul până la predarea fișierelor finale.",
    download_title: "Descarcă și instalează",
    download_sub: "Alege pachetul pentru sistemul tău din ultima versiune de pe GitHub.",
    mac_hint: "Dublu-click pe .pkg și urmează instalatorul.",
    win_hint: "Dublu-click pe .exe pentru a rula aplicația.",
    footer_line: "GDC Production Manager · gratuit și open-source (MIT) · realizat de Cristi Gordas",
    pipeline: ["Planificare","Filmare","Montaj","Colorizare","Review","Final","Predat"],
    features: [
      ["📁","Proiecte & clienți","Fiecare proiect ține locația, clientul, bugetul și status-ul de plată la un loc."],
      ["🧭","Etape clare de lucru","Urmărește fiecare proiect prin planificare, filmare, montaj, colorizare, review, final și predare."],
      ["🗂️","Căi de fișiere","Salvează căile pentru raw, montaj și export final, ca să le găsești instant."],
      ["💶","Facturare simplă","Buget total, sumă încasată și status de plată, vizibile dintr-o privire."],
      ["🌍","RO / EN / ES","Interfață completă în trei limbi, pentru tine și pentru colaboratori."],
      ["🔒","100% local","Fără cont online, fără cloud — datele rămân pe laptopul tău."],
    ],
  },
  en: {
    eyebrow: "Runs 100% locally on your laptop",
    hero_title: 'Manage your video projects <span class="accent">from planning to delivery</span>',
    hero_sub: "A free desktop app for a solo professional or any small team. Every install keeps its own data, stored locally — no cloud, no subscription.",
    cta_download: "Download latest version",
    cta_source: "Source code (GitHub)",
    features_title: "Built around the real video production workflow",
    features_sub: "From the first client call to the final delivered files.",
    download_title: "Download & install",
    download_sub: "Pick the package for your system from the latest GitHub release.",
    mac_hint: "Double-click the .pkg and follow the installer.",
    win_hint: "Double-click the .exe to run the app.",
    footer_line: "GDC Production Manager · free & open-source (MIT) · built by Cristi Gordas",
    pipeline: ["Planning","Filming","Editing","Coloring","Review","Final","Delivered"],
    features: [
      ["📁","Projects & clients","Every project keeps location, client, budget and payment status together."],
      ["🧭","Clear stages","Track each project through planning, filming, editing, coloring, review, final and delivery."],
      ["🗂️","File paths","Store the RAW, edit and final export paths so you can find them instantly."],
      ["💶","Simple invoicing","Total budget, amount paid and payment status, visible at a glance."],
      ["🌍","RO / EN / ES","Full interface in three languages, for you and your collaborators."],
      ["🔒","100% local","No online account, no cloud — your data stays on your laptop."],
    ],
  },
  es: {
    eyebrow: "Funciona 100% en local, en tu portátil",
    hero_title: 'Gestiona tus proyectos de vídeo <span class="accent">de la planificación a la entrega</span>',
    hero_sub: "Una app de escritorio gratuita para un profesional solo o cualquier equipo pequeño. Cada instalación guarda sus propios datos en local, sin nube y sin suscripción.",
    cta_download: "Descargar última versión",
    cta_source: "Código fuente (GitHub)",
    features_title: "Diseñada para el flujo real de producción de vídeo",
    features_sub: "Desde la primera llamada con el cliente hasta la entrega final.",
    download_title: "Descargar e instalar",
    download_sub: "Elige el paquete para tu sistema desde la última versión de GitHub.",
    mac_hint: "Haz doble clic en el .pkg y sigue el instalador.",
    win_hint: "Haz doble clic en el .exe para ejecutar la app.",
    footer_line: "GDC Production Manager · gratis y de código abierto (MIT) · creado por Cristi Gordas",
    pipeline: ["Planificación","Rodaje","Montaje","Etalonaje","Revisión","Final","Entregado"],
    features: [
      ["📁","Proyectos y clientes","Cada proyecto reúne ubicación, cliente, presupuesto y estado de pago."],
      ["🧭","Etapas claras","Sigue cada proyecto por planificación, rodaje, montaje, etalonaje, revisión, final y entrega."],
      ["🗂️","Rutas de archivos","Guarda las rutas de RAW, montaje y exportación final para encontrarlas al instante."],
      ["💶","Facturación simple","Presupuesto total, cantidad cobrada y estado de pago, visibles de un vistazo."],
      ["🌍","RO / EN / ES","Interfaz completa en tres idiomas, para ti y tus colaboradores."],
      ["🔒","100% local","Sin cuenta en línea, sin nube: tus datos se quedan en tu portátil."],
    ],
  },
};

let lang = localStorage.getItem("gdc_docs_lang") || "ro";

function render() {
  const d = DOCS_TRANSLATIONS[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const key = el.getAttribute("data-t");
    if (d[key] !== undefined) el.innerHTML = d[key];
  });
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));

  document.getElementById("pipeline-labels").innerHTML =
    d.pipeline.map(p => `<span>${p}</span>`).join("");

  document.getElementById("features-grid").innerHTML = d.features.map(f => `
    <div class="feature">
      <div class="icon">${f[0]}</div>
      <h3>${f[1]}</h3>
      <p>${f[2]}</p>
    </div>
  `).join("");
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    lang = btn.dataset.lang;
    localStorage.setItem("gdc_docs_lang", lang);
    render();
  });
});

render();
</script>
</body>
</html>

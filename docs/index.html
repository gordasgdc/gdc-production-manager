  :root{

  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    background-image:
      radial-gradient(circle at 10% -10%, rgba(53,214,190,0.08), transparent 40%),

    line-height:1.6;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; margin:0;}
  a{color:inherit;}
  img{max-width:100%;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  /* -------------------------------------------------------------- header */
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(16,18,24,0.82); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600;}
  .brand-mark{
    width:28px; height:28px; border-radius:7px;
    background:linear-gradient(135deg, var(--tally), var(--scope));
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#0d0f14; font-size:13px;
  }
  .lang-switch{display:flex; gap:4px;}
  .lang-btn{
    background:none; border:1px solid var(--border); color:var(--text-faint);
    border-radius:6px; padding:5px 10px; font-size:11px; font-family:var(--font-mono); cursor:pointer;
  }
  .lang-btn.active{border-color:var(--scope); color:var(--scope);}

  /* ---------------------------------------------------------------- hero */
  .hero{padding:90px 0 40px; text-align:center;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px;
    color:var(--scope); border:1px solid var(--scope-dim); background:var(--scope-dim);
    padding:6px 14px; border-radius:100px; margin-bottom:22px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--tally);}
  .hero h1{font-size:clamp(32px,5vw,52px); line-height:1.1; max-width:820px; margin:0 auto;}
  .hero h1 .accent{background:linear-gradient(90deg, var(--tally), var(--amber), var(--scope)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{color:var(--text-muted); font-size:16px; max-width:580px; margin:20px auto 0; line-height:1.6;}

  .cta-row{display:flex; gap:12px; justify-content:center; margin-top:32px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:9px; font-weight:600; font-size:14px;
    text-decoration:none; border:1px solid var(--border); transition:transform .1s ease, border-color .1s ease;
    cursor:pointer;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--scope); border-color:var(--scope); color:#0A1613;}
  .btn-secondary{background:var(--panel-2); color:var(--text);}
  .btn-secondary:hover{border-color:#3A4150;}

  /* signature element: pipeline strip echoing the in-app stage tracker */
  .pipeline-strip{max-width:760px; margin:52px auto 0; display:flex; gap:3px;}
  .pipeline-strip span{flex:1; height:6px; border-radius:3px;}
  .pipeline-strip span:nth-child(-n+3){background:var(--scope);}
  .pipeline-strip span:nth-child(4){background:var(--amber); box-shadow:0 0 0 3px rgba(232,163,61,0.15);}
  .pipeline-strip span:nth-child(n+5){background:var(--border);}
  .pipeline-labels{
    max-width:760px; margin:8px auto 0; display:flex; justify-content:space-between;
    font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase;
  }

  /* ------------------------------------------------------------ sections */
  section{padding:60px 0;}
  .section-title{text-align:center; margin-bottom:38px;}
  .section-title h2{font-size:26px;}
  .section-title p{color:var(--text-muted); margin-top:8px; font-size:14px;}

  .about-text{max-width:700px; margin:0 auto; text-align:center; color:var(--text-muted); font-size:15px;}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .feature{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px;
    opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease;
  }
  .feature.in-view{opacity:1; transform:none;}
  .feature .icon{font-size:22px; margin-bottom:12px;}
  .feature h3{font-size:15px; margin-bottom:8px;}
  .feature p{color:var(--text-muted); font-size:13px; line-height:1.55; margin:0;}

  .steps{max-width:700px; margin:0 auto; display:flex; flex-direction:column; gap:12px;}
  .step{
    display:flex; align-items:flex-start; gap:14px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:15px 18px;
    opacity:0; transform:translateX(-10px); transition:opacity .5s ease, transform .5s ease;
  }
  .step.in-view{opacity:1; transform:none;}
  .step .num{
    flex:none; width:28px; height:28px; border-radius:50%;
    background:var(--scope); color:#0A1613; font-weight:700; font-size:12.5px;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono);
  }
  .step .txt strong{display:block; margin-bottom:2px; font-size:14px;}
  .step .txt span{color:var(--text-muted); font-size:13px;}

  .roadmap{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;}
  .roadmap-item{
    background:var(--bg-elevated); border:1px dashed var(--border); border-radius:10px; padding:16px 18px; font-size:13px; color:var(--text-muted);
  }
  .roadmap-item strong{color:var(--text); display:block; margin-bottom:4px; font-size:14px;}
  .roadmap-item.done{border-style:solid; border-color:var(--scope-dim); background:var(--scope-dim);}
  .roadmap-item.done strong{color:var(--scope);}

  .platforms{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .platform-card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:26px;
    display:flex; flex-direction:column; gap:14px; text-align:center;
  }
  .platform-card .plat-icon{font-size:28px;}
  .platform-card .plat-name{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .platform-card .plat-file{font-family:var(--font-mono); font-size:12px; color:var(--text-faint);}

  footer{border-top:1px solid var(--border); padding:34px 0; text-align:center; color:var(--text-faint); font-size:12.5px;}
  footer a{color:var(--scope); text-decoration:none;}

  @media(max-width:760px){
    .grid{grid-template-columns:1fr;}
    .platforms{grid-template-columns:1fr;}

let lang = localStorage.getItem("gdc_docs_lang") || "ro";
let revealObserver = null;

function observeRevealTargets() {
  if (!("IntersectionObserver" in window)) {
    document.querySelectorAll(".feature, .step").forEach(el => el.classList.add("in-view"));
    return;
  }
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("in-view"); });
  }, { threshold: 0.15 });
  document.querySelectorAll(".feature, .step").forEach(el => revealObserver.observe(el));
}

  document.querySelectorAll("[data-t]").forEach(el => {
    const key = el.getAttribute("data-t");
    if (d[key] !== undefined) el.innerHTML = d[key];
  });
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));

  document.getElementById("pipeline-labels").innerHTML =
    d.pipeline.map(p => `<span>${p}</span>`).join("");

  document.getElementById("features-grid").innerHTML = d.features.map(f => `
    <div class="feature"><div class="icon">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>
  `).join("");

  document.getElementById("steps-list").innerHTML = d.steps.map((s, i) => `
    <div class="step"><div class="num">${i + 1}</div><div class="txt"><strong>${s[0]} ${s[1]}</strong></div></div>
  `).join("");

  document.getElementById("roadmap-grid").innerHTML = d.roadmap.map(r => `
    <div class="roadmap-item ${r[2] ? "done" : ""}"><strong>${r[0]}</strong>${r[1]}</div>
  `).join("");

  observeRevealTargets();
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    lang = btn.dataset.lang;
    localStorage.setItem("gdc_docs_lang", lang);
    render();
  });
});

render();
</script>
</body>
</html>

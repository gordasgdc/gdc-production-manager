<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Equipment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_EQUIPMENT = [];
  let ALL_CHECKOUTS = [];
  let ALL_PROJECTS = [];
  let ACTIVE_TAB = "inventory";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("equipment_title")}</h1>
          <p>${t("equipment_sub")}</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="checkout-btn">${t("checkout_new")}</button>
          <button class="btn btn-primary" id="new-btn">+ ${t("new_equipment")}</button>
        </div>
      </div>

      <div class="pill-tabs">
        <button data-tab="inventory">${t("tab_inventory")}</button>
        <button data-tab="checkouts">${t("tab_checkouts")}</button>
      </div>

      <div class="toolbar">
        <input type="text" class="search-input" id="search-input" placeholder="${t("search_equipment")}">
      </div>

      <div class="list" id="list-root"></div>
      <div id="modal-root"></div>
    `;

    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => { ACTIVE_TAB = btn.dataset.tab; renderPage(); });
    });
    document.getElementById("new-btn").addEventListener("click", () => openEquipmentModal(null));
    document.getElementById("checkout-btn").addEventListener("click", () => openCheckoutCreateModal());
    document.getElementById("search-input").addEventListener("input", renderList);
    updateTabChrome();
  }

  function updateTabChrome() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === ACTIVE_TAB);
    });
    const isCheckouts = ACTIVE_TAB === "checkouts";
    document.getElementById("search-input").style.display = isCheckouts ? "none" : "";
    renderList();
  }

  function renderList() {
    if (ACTIVE_TAB === "checkouts") renderCheckoutsList(); else renderInventoryList();
  }

  // ----------------------------------------------------------- inventory --

  function renderInventoryList() {
    const q = (document.getElementById("search-input").value || "").toLowerCase();
    let items = ALL_EQUIPMENT.filter(e =>
      !q || e.name.toLowerCase().includes(q) || (e.serial_number || "").toLowerCase().includes(q) || (e.category || "").toLowerCase().includes(q)
    );

    const list = document.getElementById("list-root");
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🎥</div>
          <p><strong>${t("no_equipment")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_equipment_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(e => `
      <div class="row-card row-card-clickable" style="grid-template-columns: 1.6fr 1fr 1fr auto;" data-preview="${e.id}">
        <div>
          <div class="row-title">${escapeHtml(e.name)}</div>
          <div class="row-sub">${e.category ? escapeHtml(e.category) : ""}</div>
        </div>
        <div class="row-meta mono">${e.serial_number ? escapeHtml(e.serial_number) : "—"}</div>
        <div class="row-meta">${equipStatusPillHtml(e.status)}</div>
        <div class="row-actions">
          <button class="btn btn-danger btn-sm" data-delete="${e.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-preview]").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".row-actions")) return;
        openEquipmentModal(Number(row.dataset.preview));
      });
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteEquipment(Number(btn.dataset.delete)));
    });
  }

  function openEquipmentModal(id) {
    const e = id ? ALL_EQUIPMENT.find(x => x.id === id) : null;
    const statusOptions = ["available", "checked_out", "maintenance", "lost"]
      .map(s => `<option value="${s}" ${e && e.status === s ? "selected" : ""}>${t("eq_" + s)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal" style="max-width:460px;">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_equipment")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="equipment-form">
            <div class="field">
              <label>${t("field_name")}</label>
              <input type="text" id="f-name" required value="${e ? escapeHtml(e.name) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_category")}</label>
                <input type="text" id="f-category" placeholder="${t("field_category_placeholder")}" value="${e && e.category ? escapeHtml(e.category) : ""}">
              </div>
              <div class="field">
                <label>${t("field_serial_number")}</label>
                <input type="text" id="f-serial" value="${e && e.serial_number ? escapeHtml(e.serial_number) : ""}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_status")}</label>
              <select id="f-status">${statusOptions}</select>
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes">${e && e.notes ? escapeHtml(e.notes) : ""}</textarea>
            </div>
            <div class="modal-actions">
              ${id ? `<button type="button" class="btn btn-danger" id="modal-delete" style="margin-right:auto;">${t("delete")}</button>` : ""}
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (ev) => {
      if (ev.target.id === "modal-backdrop") close();
    });
    if (id) {
      document.getElementById("modal-delete").addEventListener("click", async () => {
        close();
        await deleteEquipment(id);
      });
    }

    document.getElementById("equipment-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = {
        name: document.getElementById("f-name").value.trim(),
        category: document.getElementById("f-category").value,
        serial_number: document.getElementById("f-serial").value,
        status: document.getElementById("f-status").value,
        notes: document.getElementById("f-notes").value,
      };
      try {
        if (id) {
          await API.put(`/api/equipment/${id}`, payload);
        } else {
          await API.post("/api/equipment", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteEquipment(id) {
    if (!confirm(t("confirm_delete_equipment"))) return;
    try {
      await API.del(`/api/equipment/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  // ---------------------------------------------------------- checkouts --

  function renderCheckoutsList() {
    const list = document.getElementById("list-root");
    if (!ALL_CHECKOUTS.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">📋</div>
          <p><strong>${t("no_checkouts")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_checkouts_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = ALL_CHECKOUTS.map(c => {
      const complete = c.returned_at !== null;
      return `
      <div class="row-card row-card-clickable" style="grid-template-columns: 1.6fr 1fr 1fr auto;" data-preview="${c.id}">
        <div>
          <div class="row-title">${c.project_title ? escapeHtml(c.project_title) : t("checkout_no_project")}</div>
          <div class="row-sub">${fmtDate((c.checked_out_at || "").slice(0, 10))}</div>
        </div>
        <div class="row-meta mono">${c.returned_count}/${c.total_count} ${t("checkout_returned")}</div>
        <div class="row-meta">
          <span class="status-pill ${complete ? "pay-paid" : "pay-partial"}">
            <span class="dot"></span>${complete ? t("checkout_complete") : t("checkout_active")}
          </span>
        </div>
        <div class="row-actions">
          <a class="btn btn-ghost btn-sm" href="checkout-report.html?id=${c.id}" target="_blank" title="${t("project_report")}">📄</a>
        </div>
      </div>
    `;
    }).join("");

    list.querySelectorAll("[data-preview]").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".row-actions")) return;
        openCheckoutDetailModal(Number(row.dataset.preview));
      });
    });
  }

  function openCheckoutDetailModal(id) {
    const c = ALL_CHECKOUTS.find(x => x.id === id);
    if (!c) return;

    const itemsHtml = c.items.map(it => `
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; padding:6px 0;">
        <input type="checkbox" data-return-item="${it.equipment_id}" ${it.returned ? "checked disabled" : ""} style="width:auto;">
        <span style="${it.returned ? "text-decoration:line-through; color:var(--text-faint);" : ""}">${escapeHtml(it.equipment_name || "—")}</span>
      </label>
    `).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal" style="max-width:460px;">
          <div class="modal-header">
            <h3>${c.project_title ? escapeHtml(c.project_title) : t("checkout_no_project")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <div class="preview-body">
            <div class="preview-row mono">${t("checkout_out_since")} ${fmtDate((c.checked_out_at || "").slice(0, 10))}</div>
            ${c.notes ? `<div class="preview-row"><strong>${t("field_notes")}:</strong> ${escapeHtml(c.notes)}</div>` : ""}
            <div class="preview-row" style="margin-top:8px;"><strong>${t("checkout_items")}</strong></div>
            ${itemsHtml}
          </div>
          <div class="modal-actions">
            <a class="btn" href="checkout-report.html?id=${c.id}" target="_blank">${t("project_report")}</a>
            ${c.returned_at === null ? `<button type="button" class="btn btn-primary" id="modal-complete">${t("checkout_close_sheet")}</button>` : ""}
            <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
          </div>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (ev) => {
      if (ev.target.id === "modal-backdrop") close();
    });
    document.querySelectorAll("[data-return-item]").forEach(cb => {
      cb.addEventListener("change", async () => {
        try {
          await API.post(`/api/checkouts/${id}/return-item`, { equipment_id: Number(cb.dataset.returnItem) });
          await loadData();
          close();
          openCheckoutDetailModal(id);
        } catch (err) {
          showToast(errorMessage(err), "error");
        }
      });
    });
    const completeBtn = document.getElementById("modal-complete");
    if (completeBtn) {
      completeBtn.addEventListener("click", async () => {
        try {
          await API.post(`/api/checkouts/${id}/complete`);
          showToast(t("saved"));
          close();
          await loadData();
        } catch (err) {
          showToast(errorMessage(err), "error");
        }
      });
    }
  }

  function openCheckoutCreateModal() {
    const available = ALL_EQUIPMENT.filter(e => e.status === "available");
    const projectOptions = `<option value="">${t("checkout_no_project")}</option>` +
      ALL_PROJECTS.map(p => `<option value="${p.id}">${escapeHtml(p.title)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal" style="max-width:480px;">
          <div class="modal-header">
            <h3>${t("checkout_new")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="checkout-form">
            <div class="field">
              <label>${t("field_project")}</label>
              <select id="f-project">${projectOptions}</select>
            </div>
            <div class="field">
              <label>${t("checkout_pick_items")}</label>
              ${available.length ? `
                <div style="max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px;">
                  ${available.map(e => `
                    <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; padding:5px 0;">
                      <input type="checkbox" value="${e.id}" class="checkout-item-cb" style="width:auto;">
                      <span>${escapeHtml(e.name)}${e.category ? ` <span class="row-sub">(${escapeHtml(e.category)})</span>` : ""}</span>
                    </label>
                  `).join("")}
                </div>
              ` : `<p style="color:var(--text-faint); font-size:12px;">${t("checkout_none_available")}</p>`}
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes"></textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary" ${available.length ? "" : "disabled"}>${t("checkout_generate_sheet")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (ev) => {
      if (ev.target.id === "modal-backdrop") close();
    });

    document.getElementById("checkout-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const equipmentIds = [...document.querySelectorAll(".checkout-item-cb:checked")].map(cb => Number(cb.value));
      if (!equipmentIds.length) {
        showToast(t("checkout_pick_at_least_one"), "error");
        return;
      }
      try {
        const checkout = await API.post("/api/equipment/checkout", {
          equipment_ids: equipmentIds,
          project_id: document.getElementById("f-project").value || null,
          notes: document.getElementById("f-notes").value,
        });
        close();
        showToast(t("saved"));
        await loadData();
        window.open(`checkout-report.html?id=${checkout.id}`, "_blank");
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  // -------------------------------------------------------------- shared --

  async function loadData() {
    const [equipment, checkouts, projects] = await Promise.all([
      API.get("/api/equipment"),
      API.get("/api/checkouts"),
      API.get("/api/projects"),
    ]);
    ALL_EQUIPMENT = equipment;
    ALL_CHECKOUTS = checkouts;
    ALL_PROJECTS = projects;
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("equipment.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Reminders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_REMINDERS = [];
  let ALL_PROJECTS = [];
  let SHOW_DONE = false;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function reminderIcon(type) {
    return { deadline: "⏰", invoice: "💶", meeting: "🤝", general: "🔔" }[type] || "🔔";
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("reminders_title")}</h1>
          <p>${t("reminders_sub")}</p>
        </div>
        <button class="btn btn-primary" id="new-reminder-btn">+ ${t("new_reminder")}</button>
      </div>
      <div class="toolbar">
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted);">
          <input type="checkbox" id="show-done-toggle" style="width:auto;">
          ${t("show_done")}
        </label>
      </div>
      <div class="list" id="reminders-list"></div>
      <div id="modal-root"></div>
    `;
    document.getElementById("new-reminder-btn").addEventListener("click", () => openModal(null));
    document.getElementById("show-done-toggle").addEventListener("change", (e) => {
      SHOW_DONE = e.target.checked;
      renderList();
    });
  }

  function renderList() {
    const list = document.getElementById("reminders-list");
    const items = ALL_REMINDERS.filter(r => SHOW_DONE || !r.done);

    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔔</div>
          <p><strong>${t("no_reminders")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_reminders_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(r => `
      <div class="row-card" style="grid-template-columns: auto 1.6fr 1fr auto; ${r.done ? 'opacity:.55;' : ''}">
        <div>
          <input type="checkbox" data-toggle-done="${r.id}" ${r.done ? "checked" : ""} style="width:18px; height:18px;">
        </div>
        <div>
          <div class="row-title">${reminderIcon(r.reminder_type)} ${escapeHtml(r.title)}</div>
          <div class="row-sub">${r.project_title ? escapeHtml(r.project_title) : ""} ${r.description ? "· " + escapeHtml(r.description) : ""}</div>
        </div>
        <div class="row-meta mono">${fmtDate(r.due_date)} ${r.due_time ? "· " + r.due_time : ""}</div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-edit="${r.id}">${t("edit")}</button>
          <button class="btn btn-danger btn-sm" data-delete="${r.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-toggle-done]").forEach(cb => {
      cb.addEventListener("change", () => toggleDone(Number(cb.dataset.toggleDone), cb.checked));
    });
    list.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => openModal(Number(btn.dataset.edit)));
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteReminder(Number(btn.dataset.delete)));
    });
  }

  async function toggleDone(id, done) {
    try {
      await API.put(`/api/reminders/${id}`, { done });
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  function openModal(id) {
    const r = id ? ALL_REMINDERS.find(x => x.id === id) : null;

    const projectOptions = `<option value="">${t("no_client")}</option>` +
      ALL_PROJECTS.map(p => `<option value="${p.id}" ${r && r.project_id === p.id ? "selected" : ""}>${escapeHtml(p.title)}</option>`).join("");
    const typeOptions = REMINDER_TYPES.map(ty => `<option value="${ty}" ${r && r.reminder_type === ty ? "selected" : ""}>${t("reminder_type_" + ty)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal" style="max-width:480px;">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_reminder")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="reminder-form">
            <div class="field">
              <label>${t("field_reminder_title")}</label>
              <input type="text" id="f-title" required value="${r ? escapeHtml(r.title) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_due_date")}</label>
                <input type="date" id="f-due-date" required value="${r ? r.due_date : ""}">
              </div>
              <div class="field">
                <label>${t("field_due_time")}</label>
                <input type="time" id="f-due-time" value="${r && r.due_time ? r.due_time : ""}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_reminder_type")}</label>
              <select id="f-type">${typeOptions}</select>
            </div>
            <div class="field">
              <label>${t("field_related_project")}</label>
              <select id="f-project">${projectOptions}</select>
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-description">${r && r.description ? escapeHtml(r.description) : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    document.getElementById("reminder-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById("f-title").value.trim(),
        due_date: document.getElementById("f-due-date").value,
        due_time: document.getElementById("f-due-time").value,
        reminder_type: document.getElementById("f-type").value,
        project_id: document.getElementById("f-project").value || null,
        description: document.getElementById("f-description").value,
      };
      try {
        if (id) {
          await API.put(`/api/reminders/${id}`, payload);
        } else {
          await API.post("/api/reminders", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteReminder(id) {
    if (!confirm(t("confirm_delete_reminder"))) return;
    try {
      await API.del(`/api/reminders/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  async function loadData() {
    const [reminders, projects] = await Promise.all([API.get("/api/reminders"), API.get("/api/projects")]);
    ALL_REMINDERS = reminders;
    ALL_PROJECTS = projects;
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("reminders.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

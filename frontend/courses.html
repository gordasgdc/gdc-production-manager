<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Courses</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_COURSES = [];
  let ALL_CLIENTS = [];

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function courseStatusPill(status) {
    const colors = {
      scheduled: "st-planning",
      confirmed: "st-coloring",
      completed: "st-delivered",
      cancelled: "st-filming",
    };
    return `<span class="status-pill ${colors[status] || "st-planning"}"><span class="dot"></span>${t("course_status_" + status)}</span>`;
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("courses_title")}</h1>
          <p>${t("courses_sub")}</p>
        </div>
        <button class="btn btn-primary" id="new-course-btn">+ ${t("new_course")}</button>
      </div>
      <div class="list" id="courses-list"></div>
      <div id="modal-root"></div>
    `;
    document.getElementById("new-course-btn").addEventListener("click", () => openModal(null));
  }

  function renderList() {
    const list = document.getElementById("courses-list");
    if (!ALL_COURSES.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">📚</div>
          <p><strong>${t("no_courses")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_courses_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = ALL_COURSES.map(c => `
      <div class="row-card">
        <div>
          <div class="row-title">${escapeHtml(c.topic)}</div>
          <div class="row-sub">${c.client_name ? escapeHtml(c.client_name) : ""} ${c.location ? "· " + t("location_" + c.location) : ""}</div>
        </div>
        <div class="row-meta">
          <div class="mono">${fmtDate(c.date)} ${c.time ? "· " + c.time : ""}</div>
          <div class="mono">${c.duration_minutes} min</div>
        </div>
        <div class="row-meta">
          <div>${fmtMoney(c.price, c.currency)} ${c.paid ? "✅" : "⏳"}</div>
          <div style="margin-top:6px;">${courseStatusPill(c.status)}</div>
        </div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-edit="${c.id}">${t("edit")}</button>
          <button class="btn btn-danger btn-sm" data-delete="${c.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => openModal(Number(btn.dataset.edit)));
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteCourse(Number(btn.dataset.delete)));
    });
  }

  function openModal(id) {
    const c = id ? ALL_COURSES.find(x => x.id === id) : null;

    const clientOptions = `<option value="">${t("no_client")}</option>` +
      ALL_CLIENTS.map(cl => `<option value="${cl.id}" ${c && c.client_id === cl.id ? "selected" : ""}>${escapeHtml(cl.name)}</option>`).join("");
    const statusOptions = COURSE_STATUSES.map(s => `<option value="${s}" ${c && c.status === s ? "selected" : (!c && s === "scheduled" ? "selected" : "")}>${t("course_status_" + s)}</option>`).join("");
    const currencyOptions = CURRENCIES.map(cu => `<option value="${cu}" ${c && c.currency === cu ? "selected" : ""}>${t("currency_" + cu)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_course")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="course-form">
            <div class="field">
              <label>${t("field_topic")}</label>
              <input type="text" id="f-topic" required value="${c ? escapeHtml(c.topic) : ""}">
            </div>
            <div class="field">
              <label>${t("field_client")}</label>
              <select id="f-client">${clientOptions}</select>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_course_date")}</label>
                <input type="date" id="f-date" required value="${c ? c.date : ""}">
              </div>
              <div class="field">
                <label>${t("field_time")}</label>
                <input type="time" id="f-time" value="${c && c.time ? c.time : ""}">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_duration")}</label>
                <input type="number" id="f-duration" value="${c ? c.duration_minutes : 60}">
              </div>
              <div class="field">
                <label>${t("field_location_type")}</label>
                <select id="f-location">
                  <option value="online" ${c && c.location === "online" ? "selected" : ""}>${t("location_online")}</option>
                  <option value="in_person" ${c && c.location === "in_person" ? "selected" : ""}>${t("location_in_person")}</option>
                </select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_price")}</label>
                <input type="number" step="0.01" id="f-price" value="${c ? c.price : 0}">
              </div>
              <div class="field">
                <label>${t("field_currency")}</label>
                <select id="f-currency">${currencyOptions}</select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_course_status")}</label>
                <select id="f-status">${statusOptions}</select>
              </div>
              <div class="field">
                <label style="display:flex; align-items:center; gap:8px; margin-top:22px;">
                  <input type="checkbox" id="f-paid" ${c && c.paid ? "checked" : ""} style="width:auto;">
                  ${t("field_paid")}
                </label>
              </div>
            </div>
            <div class="field">
              <label>${t("field_payment_date")}</label>
              <input type="date" id="f-payment-date" value="${c && c.payment_date ? c.payment_date : ""}">
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes">${c && c.notes ? escapeHtml(c.notes) : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    document.getElementById("course-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        topic: document.getElementById("f-topic").value.trim(),
        client_id: document.getElementById("f-client").value || null,
        date: document.getElementById("f-date").value,
        time: document.getElementById("f-time").value,
        duration_minutes: parseInt(document.getElementById("f-duration").value) || 60,
        location: document.getElementById("f-location").value,
        price: parseFloat(document.getElementById("f-price").value) || 0,
        currency: document.getElementById("f-currency").value,
        status: document.getElementById("f-status").value,
        paid: document.getElementById("f-paid").checked,
        payment_date: document.getElementById("f-payment-date").value || null,
        notes: document.getElementById("f-notes").value,
      };
      try {
        if (id) {
          await API.put(`/api/courses/${id}`, payload);
        } else {
          await API.post("/api/courses", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteCourse(id) {
    if (!confirm(t("confirm_delete_course"))) return;
    try {
      await API.del(`/api/courses/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  async function loadData() {
    const [courses, clients] = await Promise.all([API.get("/api/courses"), API.get("/api/clients")]);
    ALL_COURSES = courses;
    ALL_CLIENTS = clients;
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("courses.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

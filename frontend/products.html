<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Products</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_PRODUCTS = [];

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("products_title")}</h1>
          <p>${t("products_sub")}</p>
        </div>
        <button class="btn btn-primary" id="new-product-btn">+ ${t("new_product")}</button>
      </div>
      <div class="toolbar">
        <input type="text" class="search-input" id="search-input" placeholder="${t("search_clients")}">
      </div>
      <div class="list" id="products-list"></div>
      <div id="modal-root"></div>
    `;
    document.getElementById("new-product-btn").addEventListener("click", () => openModal(null));
    document.getElementById("search-input").addEventListener("input", renderList);
  }

  function renderList() {
    const q = (document.getElementById("search-input").value || "").toLowerCase();
    const items = ALL_PRODUCTS.filter(p => !q || p.name.toLowerCase().includes(q));

    const list = document.getElementById("products-list");
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">💾</div>
          <p><strong>${t("no_products")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_products_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(p => `
      <div class="row-card">
        <div>
          <div class="row-title">${escapeHtml(p.name)}</div>
          <div class="row-sub">${t("product_type_" + p.product_type)} ${p.version ? "· v" + escapeHtml(p.version) : ""}</div>
        </div>
        <div class="row-meta">
          <div class="mono">${fmtMoney(p.price, p.currency)}</div>
          <div class="mono">${p.compatibility ? escapeHtml(p.compatibility) : ""}</div>
        </div>
        <div class="row-meta">
          ${p.download_link ? `<a href="${escapeHtml(p.download_link)}" target="_blank" style="color:var(--scope); text-decoration:none; font-size:12.5px;">🔗 ${t("open_link")}</a>` : ""}
        </div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-edit="${p.id}">${t("edit")}</button>
          <button class="btn btn-danger btn-sm" data-delete="${p.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => openModal(Number(btn.dataset.edit)));
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteProduct(Number(btn.dataset.delete)));
    });
  }

  function openModal(id) {
    const p = id ? ALL_PRODUCTS.find(x => x.id === id) : null;

    const typeOptions = PRODUCT_TYPES_LIST.map(ty => `<option value="${ty}" ${p && p.product_type === ty ? "selected" : ""}>${t("product_type_" + ty)}</option>`).join("");
    const currencyOptions = CURRENCIES.map(cu => `<option value="${cu}" ${p && p.currency === cu ? "selected" : ""}>${t("currency_" + cu)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_product")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="product-form">
            <div class="field">
              <label>${t("field_product_name")}</label>
              <input type="text" id="f-name" required value="${p ? escapeHtml(p.name) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_product_type")}</label>
                <select id="f-type">${typeOptions}</select>
              </div>
              <div class="field">
                <label>${t("field_version")}</label>
                <input type="text" id="f-version" value="${p && p.version ? escapeHtml(p.version) : ""}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_description")}</label>
              <textarea id="f-description">${p && p.description ? escapeHtml(p.description) : ""}</textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_price")}</label>
                <input type="number" step="0.01" id="f-price" value="${p ? p.price : 0}">
              </div>
              <div class="field">
                <label>${t("field_currency")}</label>
                <select id="f-currency">${currencyOptions}</select>
              </div>
            </div>
            <div class="field">
              <label>${t("field_compatibility")}</label>
              <input type="text" id="f-compatibility" placeholder="DaVinci Resolve 18+" value="${p && p.compatibility ? escapeHtml(p.compatibility) : ""}">
            </div>
            <div class="field">
              <label>${t("field_file_path")}</label>
              <input type="text" id="f-file-path" value="${p && p.file_path ? escapeHtml(p.file_path) : ""}">
            </div>
            <div class="field">
              <label>${t("field_download_link")}</label>
              <input type="text" id="f-download-link" value="${p && p.download_link ? escapeHtml(p.download_link) : ""}">
            </div>
            <div class="field">
              <label>${t("field_units_sold")}</label>
              <input type="number" id="f-units-sold" value="${p ? p.units_sold : 0}">
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    document.getElementById("product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("f-name").value.trim(),
        product_type: document.getElementById("f-type").value,
        version: document.getElementById("f-version").value,
        description: document.getElementById("f-description").value,
        price: parseFloat(document.getElementById("f-price").value) || 0,
        currency: document.getElementById("f-currency").value,
        compatibility: document.getElementById("f-compatibility").value,
        file_path: document.getElementById("f-file-path").value,
        download_link: document.getElementById("f-download-link").value,
        units_sold: parseInt(document.getElementById("f-units-sold").value) || 0,
      };
      try {
        if (id) {
          await API.put(`/api/products/${id}`, payload);
        } else {
          await API.post("/api/products", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteProduct(id) {
    if (!confirm(t("confirm_delete_product"))) return;
    try {
      await API.del(`/api/products/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  async function loadData() {
    ALL_PRODUCTS = await API.get("/api/products");
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("products.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

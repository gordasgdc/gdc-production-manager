<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Projects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_PROJECTS = [];
  let ALL_CLIENTS = [];
  let EDITING_ID = null;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("projects_title")}</h1>
          <p>${t("projects_sub")}</p>
        </div>
        <button class="btn btn-primary" id="new-project-btn">+ ${t("new_project")}</button>
      </div>

      <div class="toolbar">
        <input type="text" class="search-input" id="search-input" placeholder="${t("search_projects")}">
        <select class="filter-select" id="status-filter">
          <option value="">${t("all_statuses")}</option>
          ${STATUS_ORDER.map(s => `<option value="${s}">${t("status_" + s)}</option>`).join("")}
        </select>
      </div>

      <div class="list" id="projects-list"></div>
      <div id="modal-root"></div>
    `;

    document.getElementById("new-project-btn").addEventListener("click", () => openModal(null));
    document.getElementById("search-input").addEventListener("input", renderList);
    document.getElementById("status-filter").addEventListener("change", renderList);
  }

  function renderList() {
    const q = (document.getElementById("search-input").value || "").toLowerCase();
    const statusFilter = document.getElementById("status-filter").value;

    let items = ALL_PROJECTS.filter(p => {
      const matchesQ = !q || p.title.toLowerCase().includes(q) || (p.client_name || "").toLowerCase().includes(q);
      const matchesStatus = !statusFilter || p.status === statusFilter;
      return matchesQ && matchesStatus;
    });

    const list = document.getElementById("projects-list");
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🎬</div>
          <p><strong>${t("no_projects")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_projects_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(p => `
      <div class="row-card">
        <div>
          <div class="row-title">${escapeHtml(p.title)}</div>
          <div class="row-sub">${p.client_name ? escapeHtml(p.client_name) : ""} ${p.shoot_location ? "· " + escapeHtml(p.shoot_location) : ""}</div>
        </div>
        <div>
          ${statusPillHtml(p.status)}
          <div style="margin-top:8px;">${miniPipelineHtml(p.status)}</div>
        </div>
        <div class="row-meta">
          <div class="mono">${t("field_delivery_date")}: ${fmtDate(p.delivery_date)}</div>
          <div class="mono">${fmtMoney(p.amount_paid)} / ${fmtMoney(p.budget_total)}</div>
        </div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-edit="${p.id}">${t("edit")}</button>
          <button class="btn btn-danger btn-sm" data-delete="${p.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => openModal(Number(btn.dataset.edit)));
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteProject(Number(btn.dataset.delete)));
    });
  }

  function openModal(id) {
    EDITING_ID = id;
    const p = id ? ALL_PROJECTS.find(x => x.id === id) : null;

    const clientOptions = `<option value="">${t("no_client")}</option>` +
      ALL_CLIENTS.map(c => `<option value="${c.id}" ${p && p.client_id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("");

    const typeOptions = PROJECT_TYPES.map(ty => `<option value="${ty}" ${p && p.project_type === ty ? "selected" : ""}>${t("type_" + ty)}</option>`).join("");
    const statusOptions = STATUS_ORDER.map(s => `<option value="${s}" ${p && p.status === s ? "selected" : (!p && s === "planning" ? "selected" : "")}>${t("status_" + s)}</option>`).join("");
    const paymentOptions = PAYMENT_STATUSES.map(ps => `<option value="${ps}" ${p && p.payment_status === ps ? "selected" : ""}>${t("pay_" + ps)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_project")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="project-form">
            <div class="field">
              <label>${t("field_title")}</label>
              <input type="text" id="f-title" required value="${p ? escapeHtml(p.title) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_type")}</label>
                <select id="f-type">${typeOptions}</select>
              </div>
              <div class="field">
                <label>${t("field_status")}</label>
                <select id="f-status">${statusOptions}</select>
              </div>
            </div>
            <div class="field">
              <label>${t("field_client")}</label>
              <select id="f-client">${clientOptions}</select>
            </div>
            <div class="field">
              <label>${t("field_location")}</label>
              <input type="text" id="f-location" value="${p && p.shoot_location ? escapeHtml(p.shoot_location) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_shoot_date")}</label>
                <input type="date" id="f-shoot-date" value="${p && p.shoot_date ? p.shoot_date : ""}">
              </div>
              <div class="field">
                <label>${t("field_delivery_date")}</label>
                <input type="date" id="f-delivery-date" value="${p && p.delivery_date ? p.delivery_date : ""}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_path_raw")}</label>
              <input type="text" id="f-path-raw" value="${p && p.path_raw ? escapeHtml(p.path_raw) : ""}">
            </div>
            <div class="field">
              <label>${t("field_path_edit")}</label>
              <input type="text" id="f-path-edit" value="${p && p.path_edit ? escapeHtml(p.path_edit) : ""}">
            </div>
            <div class="field">
              <label>${t("field_path_export")}</label>
              <input type="text" id="f-path-export" value="${p && p.path_export ? escapeHtml(p.path_export) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_budget")}</label>
                <input type="number" step="0.01" id="f-budget" value="${p ? p.budget_total : 0}">
              </div>
              <div class="field">
                <label>${t("field_paid")}</label>
                <input type="number" step="0.01" id="f-paid" value="${p ? p.amount_paid : 0}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_payment_status")}</label>
              <select id="f-payment-status">${paymentOptions}</select>
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes">${p && p.notes ? escapeHtml(p.notes) : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    document.getElementById("project-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById("f-title").value.trim(),
        project_type: document.getElementById("f-type").value,
        status: document.getElementById("f-status").value,
        client_id: document.getElementById("f-client").value || null,
        shoot_location: document.getElementById("f-location").value,
        shoot_date: document.getElementById("f-shoot-date").value || null,
        delivery_date: document.getElementById("f-delivery-date").value || null,
        path_raw: document.getElementById("f-path-raw").value,
        path_edit: document.getElementById("f-path-edit").value,
        path_export: document.getElementById("f-path-export").value,
        budget_total: parseFloat(document.getElementById("f-budget").value) || 0,
        amount_paid: parseFloat(document.getElementById("f-paid").value) || 0,
        payment_status: document.getElementById("f-payment-status").value,
        notes: document.getElementById("f-notes").value,
      };
      try {
        if (id) {
          await API.put(`/api/projects/${id}`, payload);
        } else {
          await API.post("/api/projects", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteProject(id) {
    if (!confirm(t("confirm_delete_project"))) return;
    try {
      await API.del(`/api/projects/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  async function loadData() {
    const [projects, clients] = await Promise.all([API.get("/api/projects"), API.get("/api/clients")]);
    ALL_PROJECTS = projects;
    ALL_CLIENTS = clients;
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("projects.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

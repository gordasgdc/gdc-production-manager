<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Projects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_PROJECTS = [];
  let ALL_CLIENTS = [];
  let EDITING_ID = null;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("projects_title")}</h1>
          <p>${t("projects_sub")}</p>
        </div>
        <button class="btn btn-primary" id="new-project-btn">+ ${t("new_project")}</button>
      </div>

      <div class="toolbar">
        <input type="text" class="search-input" id="search-input" placeholder="${t("search_projects")}">
        <select class="filter-select" id="status-filter">
          <option value="">${t("all_statuses")}</option>
          ${STATUS_ORDER.map(s => `<option value="${s}">${t("status_" + s)}</option>`).join("")}
        </select>
      </div>

      <div class="list" id="projects-list"></div>
      <div id="modal-root"></div>
    `;

    document.getElementById("new-project-btn").addEventListener("click", () => openModal(null));
    document.getElementById("search-input").addEventListener("input", renderList);
    document.getElementById("status-filter").addEventListener("change", renderList);
  }

  function renderList() {
    const q = (document.getElementById("search-input").value || "").toLowerCase();
    const statusFilter = document.getElementById("status-filter").value;

    let items = ALL_PROJECTS.filter(p => {
      const matchesQ = !q || p.title.toLowerCase().includes(q) || (p.client_name || "").toLowerCase().includes(q);
      const matchesStatus = !statusFilter || p.status === statusFilter;
      return matchesQ && matchesStatus;
    });

    const list = document.getElementById("projects-list");
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🎬</div>
          <p><strong>${t("no_projects")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_projects_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(p => `
      <div class="row-card row-card-clickable" data-preview="${p.id}">
        <div>
          <div class="row-title">${escapeHtml(p.title)}</div>
          <div class="row-sub">${p.client_name ? escapeHtml(p.client_name) : ""} ${p.shoot_location ? "· " + escapeHtml(p.shoot_location) : ""}</div>
        </div>
        <div>
          ${statusPillHtml(p.status)}
          <div style="margin-top:8px;">${miniPipelineHtml(p.status)}</div>
        </div>
        <div class="row-meta">
          <div class="mono">${t("field_delivery_date")}: ${fmtDate(p.delivery_date)}</div>
          <div class="mono">${fmtMoney(p.amount_paid, p.currency)} / ${fmtMoney(p.budget_total, p.currency)}</div>
        </div>
        <div class="row-actions">
          <a class="btn btn-ghost btn-sm" href="project-report.html?id=${p.id}" title="${t("project_report")}">📄</a>
          ${p.status !== "delivered" ? `<button class="btn btn-ghost btn-sm" data-next-step="${p.id}" title="${t("next_step")}">→</button>` : ""}
          <button class="btn btn-danger btn-sm" data-delete="${p.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    // The whole row opens the read-only Quick Preview - a dedicated Edit
    // button became redundant once clicking anywhere on a project does
    // that; row-actions (report/next-step/delete) stop the click from
    // also triggering the preview, since they're more specific/destructive.
    list.querySelectorAll("[data-preview]").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".row-actions")) return;
        openPreview(Number(row.dataset.preview));
      });
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteProject(Number(btn.dataset.delete)));
    });
    list.querySelectorAll("[data-next-step]").forEach(btn => {
      btn.addEventListener("click", () => advanceNextStep(Number(btn.dataset.nextStep)));
    });
  }

  /// Read-only Quick Preview - the fast path to "just look at this
  /// project" without opening the full edit form. Its own "Editează"
  /// button hands off to the existing openModal() edit flow.
  function openPreview(id) {
    const p = ALL_PROJECTS.find(x => x.id === id);
    if (!p) return;

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="preview-backdrop">
        <div class="modal">
          <div class="modal-header">
            <h3>${escapeHtml(p.title)}</h3>
            <button class="modal-close" id="preview-close">✕</button>
          </div>
          <div class="preview-body">
            <div class="preview-row">${statusPillHtml(p.status)} <span class="row-sub">${t("type_" + p.project_type)}</span></div>
            ${p.client_name ? `<div class="preview-row"><strong>${t("field_client")}:</strong> ${escapeHtml(p.client_name)}</div>` : ""}
            ${p.shoot_location ? `<div class="preview-row"><strong>${t("field_location")}:</strong> ${escapeHtml(p.shoot_location)}</div>` : ""}
            <div class="preview-row"><strong>${t("field_shoot_date")}:</strong> ${fmtDate(p.shoot_date)}</div>
            <div class="preview-row"><strong>${t("field_delivery_date")}:</strong> ${fmtDate(p.delivery_date)}</div>
            <div class="preview-row"><strong>${t("field_budget")}:</strong> ${fmtMoney(p.amount_paid, p.currency)} / ${fmtMoney(p.budget_total, p.currency)} · ${t("pay_" + p.payment_status)}</div>
            ${p.notes ? `<div class="preview-row"><strong>${t("field_notes")}:</strong> ${escapeHtml(p.notes)}</div>` : ""}
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" id="preview-close-2">${t("cancel")}</button>
            <button type="button" class="btn btn-primary" id="preview-edit">${t("edit")}</button>
          </div>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("preview-close").addEventListener("click", close);
    document.getElementById("preview-close-2").addEventListener("click", close);
    document.getElementById("preview-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "preview-backdrop") close();
    });
    document.getElementById("preview-edit").addEventListener("click", () => {
      close();
      openModal(id);
    });
  }

  async function advanceNextStep(id) {
    try {
      const result = await API.post(`/api/projects/${id}/next-step`);
      showToast(tf("next_step_done", { status: t("status_" + result.status) }));
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  function openModal(id) {
    EDITING_ID = id;
    const p = id ? ALL_PROJECTS.find(x => x.id === id) : null;

    const clientOptions = `<option value="">${t("no_client")}</option>` +
      ALL_CLIENTS.map(c => `<option value="${c.id}" ${p && p.client_id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("");

    const typeOptions = PROJECT_TYPES.map(ty => `<option value="${ty}" ${p && p.project_type === ty ? "selected" : ""}>${t("type_" + ty)}</option>`).join("");
    const statusOptions = STATUS_ORDER.map(s => `<option value="${s}" ${p && p.status === s ? "selected" : (!p && s === "planning" ? "selected" : "")}>${t("status_" + s)}</option>`).join("");
    const paymentOptions = PAYMENT_STATUSES.map(ps => `<option value="${ps}" ${p && p.payment_status === ps ? "selected" : ""}>${t("pay_" + ps)}</option>`).join("");
    const currencyOptions = CURRENCIES.map(cu => `<option value="${cu}" ${p && p.currency === cu ? "selected" : (!p && cu === "EUR" ? "selected" : "")}>${t("currency_" + cu)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_project")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="project-form">
            <div class="field">
              <label>${t("field_title")}</label>
              <input type="text" id="f-title" required value="${p ? escapeHtml(p.title) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_type")}</label>
                <select id="f-type">${typeOptions}</select>
              </div>
              <div class="field">
                <label>${t("field_status")}</label>
                <select id="f-status">${statusOptions}</select>
              </div>
            </div>
            <div class="field">
              <label>${t("field_client")}</label>
              <select id="f-client">${clientOptions}</select>
            </div>
            <div class="field">
              <label>${t("field_location")}</label>
              <input type="text" id="f-location" value="${p && p.shoot_location ? escapeHtml(p.shoot_location) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_shoot_date")}</label>
                <input type="date" id="f-shoot-date" value="${p && p.shoot_date ? p.shoot_date : ""}">
              </div>
              <div class="field">
                <label>${t("field_delivery_date")}</label>
                <input type="date" id="f-delivery-date" value="${p && p.delivery_date ? p.delivery_date : ""}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_path_raw")}</label>
              <input type="text" id="f-path-raw" value="${p && p.path_raw ? escapeHtml(p.path_raw) : ""}">
            </div>
            <div class="field">
              <label>${t("field_path_edit")}</label>
              <input type="text" id="f-path-edit" value="${p && p.path_edit ? escapeHtml(p.path_edit) : ""}">
            </div>
            <div class="field">
              <label>${t("field_path_export")}</label>
              <input type="text" id="f-path-export" value="${p && p.path_export ? escapeHtml(p.path_export) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_budget")}</label>
                <input type="number" step="0.01" id="f-budget" value="${p ? p.budget_total : 0}">
              </div>
              <div class="field">
                <label>${t("field_paid")}</label>
                <input type="number" step="0.01" id="f-paid" value="${p ? p.amount_paid : 0}">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_payment_status")}</label>
                <select id="f-payment-status">${paymentOptions}</select>
              </div>
              <div class="field">
                <label>${t("field_currency")}</label>
                <select id="f-currency">${currencyOptions}</select>
              </div>
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes">${p && p.notes ? escapeHtml(p.notes) : ""}</textarea>
            </div>
            ${id ? `
              <div class="field">
                <label>${t("stage_notes_title")} — ${t("status_" + (p ? p.status : "planning"))}</label>
                <textarea id="f-stage-note">${p && p.stage_notes && p.stage_notes[p.status] ? escapeHtml(p.stage_notes[p.status]) : ""}</textarea>
                <div class="field-hint">${t("stage_notes_save")} ${t("save").toLowerCase()}</div>
              </div>
            ` : ""}
            ${id ? `
              <div class="field">
                <label>${t("attachments_title")}</label>
                <div class="attachments-list" id="attachments-list"><p style="color:var(--text-faint); font-size:12px;">…</p></div>
                <div class="attach-drop" id="attach-drop">${t("attach_upload_hint")}</div>
                <input type="file" id="attach-file-input" style="display:none;">
              </div>
              <div class="field">
                <label>${t("checklists_title")}</label>
                <div id="checklists-container"><p style="color:var(--text-faint); font-size:12px;">…</p></div>
                <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
                  <select id="new-checklist-template" style="flex:1; min-width:160px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:8px 10px; font-size:12.5px;">
                    <option value="">${t("no_template")}</option>
                  </select>
                  <button type="button" class="btn btn-ghost btn-sm" id="add-checklist-btn">+ ${t("new_checklist")}</button>
                </div>
              </div>
            ` : ""}
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    if (id) {
      loadAttachments(id);
      document.getElementById("attach-drop").addEventListener("click", () => {
        document.getElementById("attach-file-input").click();
      });
      document.getElementById("attach-file-input").addEventListener("change", (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (file) uploadAttachment(id, file);
      });

      loadChecklists(id);
      loadChecklistTemplatesIntoSelect();
      document.getElementById("add-checklist-btn").addEventListener("click", () => createChecklist(id));
    }

    document.getElementById("project-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById("f-title").value.trim(),
        project_type: document.getElementById("f-type").value,
        status: document.getElementById("f-status").value,
        client_id: document.getElementById("f-client").value || null,
        shoot_location: document.getElementById("f-location").value,
        shoot_date: document.getElementById("f-shoot-date").value || null,
        delivery_date: document.getElementById("f-delivery-date").value || null,
        path_raw: document.getElementById("f-path-raw").value,
        path_edit: document.getElementById("f-path-edit").value,
        path_export: document.getElementById("f-path-export").value,
        budget_total: parseFloat(document.getElementById("f-budget").value) || 0,
        amount_paid: parseFloat(document.getElementById("f-paid").value) || 0,
        payment_status: document.getElementById("f-payment-status").value,
        currency: document.getElementById("f-currency").value,
        notes: document.getElementById("f-notes").value,
      };
      try {
        if (id) {
          await API.put(`/api/projects/${id}`, payload);
          const stageNoteEl = document.getElementById("f-stage-note");
          if (stageNoteEl && p) {
            await API.put(`/api/projects/${id}/stage-notes`, { status: p.status, note: stageNoteEl.value });
          }
        } else {
          await API.post("/api/projects", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  function fmtFileSize(bytes) {
    if (!bytes) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  async function loadAttachments(projectId) {
    const container = document.getElementById("attachments-list");
    if (!container) return;
    try {
      const items = await API.get(`/api/projects/${projectId}/attachments`);
      renderAttachmentsList(projectId, items);
    } catch (e) {
      container.innerHTML = "";
    }
  }

  function renderAttachmentsList(projectId, items) {
    const container = document.getElementById("attachments-list");
    if (!container) return;
    if (!items.length) {
      container.innerHTML = `<p style="color:var(--text-faint); font-size:12px;">${t("no_attachments")}</p>`;
      return;
    }
    container.innerHTML = items.map(a => `
      <div class="attachment-row">
        <div class="att-name">📎 ${escapeHtml(a.filename)} <span class="att-size">${fmtFileSize(a.size_bytes)}</span></div>
        <div style="display:flex; gap:10px; align-items:center;">
          <a href="/api/attachments/${a.id}/download" target="_blank" style="font-size:12px; color:var(--scope); text-decoration:none;">${t("attach_download")}</a>
          <button type="button" class="btn btn-danger btn-sm" style="padding:3px 8px;" data-remove-attachment="${a.id}">✕</button>
        </div>
      </div>
    `).join("");

    container.querySelectorAll("[data-remove-attachment]").forEach(btn => {
      btn.addEventListener("click", () => removeAttachment(projectId, Number(btn.dataset.removeAttachment)));
    });
  }

  async function uploadAttachment(projectId, file) {
    const container = document.getElementById("attachments-list");
    if (container) container.innerHTML = `<p style="color:var(--text-faint); font-size:12px;">${t("attach_uploading")}</p>`;
    try {
      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch(`/api/projects/${projectId}/attachments`, {
        method: "POST",
        body: formData,
        credentials: "same-origin",
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "request_failed");
      await loadAttachments(projectId);
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
      await loadAttachments(projectId);
    }
  }

  async function removeAttachment(projectId, attachmentId) {
    if (!confirm(t("confirm_delete_attachment"))) return;
    try {
      await API.del(`/api/attachments/${attachmentId}`);
      await loadAttachments(projectId);
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function loadChecklistTemplatesIntoSelect() {
    const select = document.getElementById("new-checklist-template");
    if (!select) return;
    try {
      const templates = await API.get("/api/checklist-templates");
      select.innerHTML = `<option value="">${t("no_template")}</option>` +
        templates.map(tpl => `<option value="${tpl.id}">${escapeHtml(tpl.name)} (${t("checklist_type_" + tpl.checklist_type)})</option>`).join("");
    } catch (e) {}
  }

  async function loadChecklists(projectId) {
    const container = document.getElementById("checklists-container");
    if (!container) return;
    try {
      const checklists = await API.get(`/api/projects/${projectId}/checklists`);
      renderChecklists(projectId, checklists);
    } catch (e) {
      container.innerHTML = "";
    }
  }

  function renderChecklists(projectId, checklists) {
    const container = document.getElementById("checklists-container");
    if (!container) return;
    if (!checklists.length) {
      container.innerHTML = `<p style="color:var(--text-faint); font-size:12px;">${t("no_checklists")}</p>`;
      return;
    }

    container.innerHTML = checklists.map(cl => {
      const pct = cl.total_count ? Math.round((cl.done_count / cl.total_count) * 100) : 0;
      return `
      <div class="card" style="margin-bottom:10px; padding:14px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
          <div>
            <strong style="font-size:13.5px;">${escapeHtml(cl.name)}</strong>
            <span class="row-sub" style="margin-left:6px;">${t("checklist_type_" + cl.checklist_type)}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <a class="btn btn-ghost btn-sm" href="checklist-report.html?id=${cl.id}" target="_blank" title="${t("project_report")}" style="padding:3px 8px;">📄</a>
            <button type="button" class="btn btn-danger btn-sm" data-delete-checklist="${cl.id}" style="padding:3px 8px;">✕</button>
          </div>
        </div>
        <div class="checklist-progress-track">
          <div class="checklist-progress-fill ${pct === 100 ? "complete" : ""}" style="width:${pct}%;"></div>
        </div>
        <div class="checklist-progress-label">
          <span>${pct}%</span>
          <span>${cl.done_count}/${cl.total_count}</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; margin:10px 0;">
          ${cl.items.map(it => `
            <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;">
              <input type="checkbox" data-toggle-item="${cl.id}:${it.id}" ${it.done ? "checked" : ""} style="width:auto;">
              <span style="${it.done ? "text-decoration:line-through; color:var(--text-faint);" : ""}">${escapeHtml(it.text)}</span>
            </label>
          `).join("")}
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="btn btn-ghost btn-sm" data-mark-all="${cl.id}">${t("mark_all")}</button>
          <input type="text" placeholder="${t("add_item_placeholder")}" data-new-item="${cl.id}" style="flex:1; min-width:140px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:6px 10px; font-size:12.5px;">
        </div>
      </div>
    `;
    }).join("");

    container.querySelectorAll("[data-toggle-item]").forEach(cb => {
      cb.addEventListener("change", () => {
        const [clId, itemId] = cb.dataset.toggleItem.split(":");
        toggleChecklistItem(projectId, Number(clId), itemId);
      });
    });
    container.querySelectorAll("[data-mark-all]").forEach(btn => {
      btn.addEventListener("click", () => markAllChecklist(projectId, Number(btn.dataset.markAll)));
    });
    container.querySelectorAll("[data-delete-checklist]").forEach(btn => {
      btn.addEventListener("click", () => deleteChecklist(projectId, Number(btn.dataset.deleteChecklist)));
    });
    container.querySelectorAll("[data-new-item]").forEach(input => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const text = input.value.trim();
          if (text) addChecklistItem(projectId, Number(input.dataset.newItem), text);
        }
      });
    });
  }

  async function createChecklist(projectId) {
    const templateId = document.getElementById("new-checklist-template").value;
    try {
      await API.post(`/api/projects/${projectId}/checklists`, {
        template_id: templateId || null,
        name: templateId ? undefined : t("new_checklist"),
        checklist_type: "general",
      });
      await loadChecklists(projectId);
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function toggleChecklistItem(projectId, checklistId, itemId) {
    try {
      await API.post(`/api/checklists/${checklistId}/toggle-item`, { item_id: itemId });
      await loadChecklists(projectId);
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function markAllChecklist(projectId, checklistId) {
    try {
      await API.post(`/api/checklists/${checklistId}/mark-all`, { done: true });
      await loadChecklists(projectId);
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function addChecklistItem(projectId, checklistId, text) {
    try {
      await API.post(`/api/checklists/${checklistId}/items`, { text });
      await loadChecklists(projectId);
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function deleteChecklist(projectId, checklistId) {
    if (!confirm(t("confirm_delete_checklist"))) return;
    try {
      await API.del(`/api/checklists/${checklistId}`);
      await loadChecklists(projectId);
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function deleteProject(id) {
    if (!confirm(t("confirm_delete_project"))) return;
    try {
      await API.del(`/api/projects/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  async function loadData() {
    const [projects, clients] = await Promise.all([API.get("/api/projects"), API.get("/api/clients")]);
    ALL_PROJECTS = projects;
    ALL_CLIENTS = clients;
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("projects.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="clapper">🎬</div>
      <h1 data-t="app_name">GDC Production Manager</h1>
      <p data-t="tagline">Gestionare proiecte video</p>
    </div>

    <div id="first-run-hint" style="display:none;" class="auth-error" style="background:var(--panel-2); color:var(--text-muted); border:1px solid var(--border);">
      <span data-t="first_run_hint"></span>
    </div>

    <div class="auth-tabs" id="auth-tabs">
      <div class="auth-tab active" data-tab="login" data-t="tab_login">Autentificare</div>
      <div class="auth-tab" data-tab="register" data-t="tab_register">Cont nou</div>
    </div>

    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <form id="login-form">
      <div class="field">
        <label data-t="username">Utilizator</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label data-t="password">Parolă</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-t="login_btn">Intră în cont</button>
    </form>

    <form id="register-form" style="display:none;">
      <div class="field">
        <label data-t="display_name">Nume afișat</label>
        <input type="text" id="register-display-name" autocomplete="name">
      </div>
      <div class="field">
        <label data-t="username">Utilizator</label>
        <input type="text" id="register-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label data-t="password">Parolă</label>
        <input type="password" id="register-password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-t="register_btn">Creează cont</button>
    </form>

    <div class="lang-switch" style="margin-top:20px;">
      <button class="lang-btn" data-lang="ro">RO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
  </div>
</div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  function refreshLangButtons() {
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === CURRENT_LANG));
  }

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      setLang(btn.dataset.lang);
      applyStaticTranslations();
      refreshLangButtons();
    });
  });

  document.querySelectorAll(".auth-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".auth-tab").forEach(t2 => t2.classList.remove("active"));
      tab.classList.add("active");
      const isLogin = tab.dataset.tab === "login";
      document.getElementById("login-form").style.display = isLogin ? "block" : "none";
      document.getElementById("register-form").style.display = isLogin ? "none" : "block";
      document.getElementById("auth-error").style.display = "none";
    });
  });

  function showAuthError(msg) {
    const el = document.getElementById("auth-error");
    el.textContent = msg;
    el.style.display = "block";
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await API.post("/api/auth/login", {
        username: document.getElementById("login-username").value.trim(),
        password: document.getElementById("login-password").value,
      });
      window.location.href = "index.html";
    } catch (err) {
      showAuthError(errorMessage(err));
    }
  });

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await API.post("/api/auth/register", {
        display_name: document.getElementById("register-display-name").value.trim(),
        username: document.getElementById("register-username").value.trim(),
        password: document.getElementById("register-password").value,
        language: CURRENT_LANG,
      });
      window.location.href = "index.html";
    } catch (err) {
      showAuthError(errorMessage(err));
    }
  });

  (async function init() {
    applyStaticTranslations();
    refreshLangButtons();
    try {
      const status = await API.get("/api/auth/status");
      if (status.authenticated) {
        window.location.href = "index.html";
        return;
      }
    } catch (e) {}
    try {
      const acc = await API.get("/api/auth/has-account");
      if (!acc.has_account) {
        document.getElementById("first-run-hint").style.display = "block";
        document.querySelector('.auth-tab[data-tab="register"]').click();
      }
    } catch (e) {}
  })();
</script>
</body>
</html>

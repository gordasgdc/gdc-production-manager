<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let CURRENT_USER_STATE = null;

  function renderPage(user) {
    CURRENT_USER_STATE = user;
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("settings_title")}</h1>
          <p>${t("settings_sub")}</p>
        </div>
      </div>

      <div class="card settings-section">
        <h3>${t("settings_data_section")}</h3>
        <div class="settings-row">
          <div>
            <div class="settings-label">${t("export_data")}</div>
            <div class="settings-hint">JSON — clienți, proiecte, șabloane</div>
          </div>
          <button class="btn btn-ghost btn-sm" id="export-btn">⬇️ ${t("export_data")}</button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">${t("import_data")}</div>
            <div class="settings-hint">${t("import_confirm")}</div>
          </div>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
            ⬆️ ${t("import_data")}
            <input type="file" id="import-input" accept="application/json" style="display:none;">
          </label>
        </div>
      </div>

      <div class="card settings-section">
        <div class="settings-row">
          <div>
            <div class="settings-label">GDC Production Manager <span id="settings-app-version" class="row-meta"></span></div>
            <div id="update-status-line" class="settings-hint"></div>
          </div>
          <button class="btn btn-ghost btn-sm" id="check-updates-btn">${t("check_updates_btn")}</button>
        </div>
      </div>

      <div class="card settings-section" id="license">
        <h3>${t("settings_license_section")}</h3>
        <div id="license-status-line" class="settings-hint" style="margin-bottom:12px;">…</div>
        <div class="field">
          <label>${t("machine_id_label")}</label>
          <div class="code-box">
            <span class="val" id="settings-machine-id">…</span>
            <button type="button" class="btn btn-sm" id="settings-copy-machine-id">${t("copy_btn")}</button>
          </div>
        </div>
        <a class="btn btn-whatsapp" id="settings-whatsapp-btn" href="#" target="_blank" rel="noopener" style="margin:6px 0 16px;">${t("whatsapp_btn")}</a>
        <form id="settings-activate-form">
          <div class="field">
            <label>${t("serial_label")}</label>
            <input type="text" id="settings-serial-input" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
          </div>
          <button type="submit" class="btn btn-primary">${t("activate_btn")}</button>
        </form>
      </div>

      <div class="card settings-section">
        <h3>${t("settings_security_section")}</h3>
        <div class="settings-row">
          <div>
            <div class="settings-label">${t("regenerate_recovery_title")}</div>
            <div class="settings-hint">${t("regenerate_recovery_sub")}</div>
          </div>
          <button class="btn btn-ghost btn-sm" id="regenerate-recovery-btn">${t("regenerate_recovery_btn")}</button>
        </div>
        <div id="webauthn-row" class="settings-row" style="display:none;">
          <div>
            <div class="settings-label">${t("webauthn_section_title")}</div>
            <div class="settings-hint">${t("webauthn_section_sub")}</div>
          </div>
          <button class="btn btn-ghost btn-sm" id="webauthn-enable-btn">${t("webauthn_enable_btn")}</button>
        </div>
        <div id="recovery-modal-settings-root"></div>
      </div>

      <div class="card settings-section">
        <h3>${t("settings_sync_section")}</h3>
        <p class="settings-hint" style="margin-bottom:16px;">${t("sync_hint")}</p>
        <div class="field">
          <label>${t("sync_remote_url")}</label>
          <input type="text" id="sync-url" placeholder="http://192.168.1.20:5175" value="${user.sync_remote_url ? escapeHtml(user.sync_remote_url) : ""}">
        </div>
        <div class="field">
          <label>${t("sync_token")}</label>
          <input type="text" id="sync-token" placeholder="••••••••">
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">
          <button class="btn" id="sync-save-btn">${t("sync_save")}</button>
          <button class="btn btn-primary" id="sync-push-btn">${t("sync_push")}</button>
          <button class="btn" id="sync-pull-btn">${t("sync_pull")}</button>
        </div>
        <div class="sync-status" id="sync-status"></div>
      </div>

      <div class="card settings-section">
        <h3>${t("checklist_templates_section")}</h3>
        <div id="templates-list" class="list" style="margin-bottom:14px;"></div>
        <button class="btn btn-ghost btn-sm" id="new-template-btn">+ ${t("new_template")}</button>
        <div id="template-modal-root"></div>
      </div>
    `;

    updateSyncStatus(user);
    loadTemplates();
    loadLicenseStatus();

    document.getElementById("export-btn").addEventListener("click", exportData);
    document.getElementById("import-input").addEventListener("change", importData);
    document.getElementById("sync-save-btn").addEventListener("click", saveSyncSettings);
    document.getElementById("sync-push-btn").addEventListener("click", () => runSync("push"));
    document.getElementById("sync-pull-btn").addEventListener("click", () => runSync("pull"));
    document.getElementById("new-template-btn").addEventListener("click", () => openTemplateModal(null));
    document.getElementById("settings-copy-machine-id").addEventListener("click", () => {
      navigator.clipboard.writeText(LAST_LICENSE_STATUS.machine_id).then(() => showToast(t("copied_toast")));
    });
    document.getElementById("settings-activate-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await API.post("/api/license/activate", { serial: document.getElementById("settings-serial-input").value.trim() });
        showToast(t("saved"));
        loadLicenseStatus();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
    document.getElementById("regenerate-recovery-btn").addEventListener("click", openRegenerateRecoveryModal);
    document.getElementById("check-updates-btn").onclick = checkForUpdates;
    loadAppVersion();
    setupWebauthnSection(user);
  }

  async function setupWebauthnSection(user) {
    if (!webauthnSupported()) return;
    const row = document.getElementById("webauthn-row");
    row.style.display = "flex";
    const btn = document.getElementById("webauthn-enable-btn");
    try {
      const cred = await API.get(`/api/auth/webauthn/has-credential?username=${encodeURIComponent(user.username)}`);
      if (cred.has_credential) {
        btn.textContent = t("webauthn_enabled_status");
        btn.disabled = true;
        return;
      }
    } catch (e) {}
    btn.addEventListener("click", async () => {
      try {
        await webauthnRegister();
        showToast(t("saved"));
        btn.textContent = t("webauthn_enabled_status");
        btn.disabled = true;
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function loadAppVersion() {
    try {
      const v = await API.get("/api/version");
      document.getElementById("settings-app-version").textContent = "v" + v.version;
    } catch (e) {}
  }

  async function checkForUpdates() {
    const line = document.getElementById("update-status-line");
    const btn = document.getElementById("check-updates-btn");
    line.textContent = t("update_checking");
    btn.disabled = true;
    try {
      const result = await API.get("/api/update/check");
      if (result.update_available) {
        const platform = navigator.platform.toLowerCase().includes("mac") ? "mac" : "windows";
        const url = result.download_url[platform] || result.download_url.mac;
        line.innerHTML = `${tf("update_available", { version: result.latest_version })}${result.changes ? " — " + escapeHtml(result.changes) : ""}`;
        btn.textContent = t("update_download_btn");
        btn.onclick = () => window.open(url, "_blank");
      } else {
        line.textContent = t("update_none");
        btn.textContent = t("check_updates_btn");
        btn.onclick = checkForUpdates;
      }
    } catch (e) {
      line.textContent = errorMessage(e);
    } finally {
      btn.disabled = false;
    }
  }

  function openRegenerateRecoveryModal() {
    document.getElementById("recovery-modal-settings-root").innerHTML = `
      <div class="recovery-modal-backdrop" id="regen-modal-backdrop">
        <div class="recovery-modal">
          <h2>${t("regenerate_recovery_title")}</h2>
          <p>${t("regenerate_recovery_sub")}</p>
          <form id="regen-recovery-form">
            <div class="field">
              <label>${t("current_password_label")}</label>
              <input type="password" id="regen-current-password" autocomplete="current-password" required>
            </div>
            <div style="display:flex; gap:10px;">
              <button type="button" class="btn" id="regen-cancel-btn" style="flex:1;">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary" style="flex:1;">${t("regenerate_recovery_btn")}</button>
            </div>
          </form>
        </div>
      </div>
    `;
    const close = () => { document.getElementById("recovery-modal-settings-root").innerHTML = ""; };
    document.getElementById("regen-cancel-btn").addEventListener("click", close);
    document.getElementById("regen-recovery-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const result = await API.post("/api/auth/regenerate-recovery-code", {
          current_password: document.getElementById("regen-current-password").value,
        });
        close();
        showRecoveryModal(result.recovery_code);
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  function showRecoveryModal(code) {
    document.getElementById("recovery-modal-settings-root").innerHTML = `
      <div class="recovery-modal-backdrop">
        <div class="recovery-modal">
          <h2>${t("recovery_modal_title")}</h2>
          <p>${t("recovery_modal_text")}</p>
          <div class="code-box" style="margin-bottom:18px;"><span class="val">${code}</span></div>
          <button class="btn btn-primary btn-block" id="regen-modal-confirm-btn">${t("recovery_modal_confirm")}</button>
        </div>
      </div>
    `;
    document.getElementById("regen-modal-confirm-btn").addEventListener("click", () => {
      document.getElementById("recovery-modal-settings-root").innerHTML = "";
    });
  }

  let LAST_LICENSE_STATUS = null;

  async function loadLicenseStatus() {
    try {
      LAST_LICENSE_STATUS = await API.get("/api/license/status");
      document.getElementById("settings-machine-id").textContent = LAST_LICENSE_STATUS.machine_id;
      const msg = encodeURIComponent(
        `Salut! Vreau să activez GDC Production Manager (25€ lifetime). ID calculator: ${LAST_LICENSE_STATUS.machine_id}`
      );
      document.getElementById("settings-whatsapp-btn").href = `https://wa.me/34643109970?text=${msg}`;
      const line = document.getElementById("license-status-line");
      if (LAST_LICENSE_STATUS.licensed) {
        line.textContent = t("license_status_licensed");
      } else if (LAST_LICENSE_STATUS.trial_days_remaining > 0) {
        line.textContent = tf("license_status_trial", { days: LAST_LICENSE_STATUS.trial_days_remaining });
      } else {
        line.textContent = t("license_status_expired");
      }
    } catch (e) {}
  }

  let ALL_TEMPLATES = [];

  async function loadTemplates() {
    try {
      ALL_TEMPLATES = await API.get("/api/checklist-templates");
      renderTemplatesList();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  function renderTemplatesList() {
    const container = document.getElementById("templates-list");
    if (!ALL_TEMPLATES.length) {
      container.innerHTML = `<p style="color:var(--text-faint); font-size:13px;">${t("no_templates")}</p>`;
      return;
    }
    container.innerHTML = ALL_TEMPLATES.map(tpl => `
      <div class="row-card" style="grid-template-columns: 1.6fr 1fr auto;">
        <div>
          <div class="row-title">${escapeHtml(tpl.name)} ${tpl.is_default ? '<span class="status-pill st-final" style="margin-left:6px;">implicit</span>' : ""}</div>
          <div class="row-sub">${t("checklist_type_" + tpl.checklist_type)}${tpl.project_type ? " · " + t("type_" + tpl.project_type) : ""} · ${tpl.items.length} item-uri</div>
        </div>
        <div class="row-meta" style="font-size:12px; color:var(--text-faint);">${tpl.items.slice(0,3).map(escapeHtml).join(", ")}${tpl.items.length > 3 ? "…" : ""}</div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-edit-template="${tpl.id}">${t("edit")}</button>
          <button class="btn btn-danger btn-sm" data-delete-template="${tpl.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    container.querySelectorAll("[data-edit-template]").forEach(btn => {
      btn.addEventListener("click", () => openTemplateModal(Number(btn.dataset.editTemplate)));
    });
    container.querySelectorAll("[data-delete-template]").forEach(btn => {
      btn.addEventListener("click", () => deleteTemplate(Number(btn.dataset.deleteTemplate)));
    });
  }

  function openTemplateModal(id) {
    const tpl = id ? ALL_TEMPLATES.find(x => x.id === id) : null;
    const typeOptions = CHECKLIST_TYPES.map(ty => `<option value="${ty}" ${tpl && tpl.checklist_type === ty ? "selected" : ""}>${t("checklist_type_" + ty)}</option>`).join("");

    document.getElementById("template-modal-root").innerHTML = `
      <div class="modal-backdrop" id="tpl-modal-backdrop">
        <div class="modal" style="max-width:460px;">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_template")}</h3>
            <button class="modal-close" id="tpl-modal-close">✕</button>
          </div>
          <form id="template-form">
            <div class="field">
              <label>${t("template_name")}</label>
              <input type="text" id="tpl-name" required value="${tpl ? escapeHtml(tpl.name) : ""}">
            </div>
            <div class="field">
              <label>${t("field_type")}</label>
              <select id="tpl-type">${typeOptions}</select>
            </div>
            <div class="field">
              <label>${t("template_project_type")}</label>
              <select id="tpl-project-type">
                <option value="">${t("no_template")}</option>
                ${PROJECT_TYPES.map(pt => `<option value="${pt}" ${tpl && tpl.project_type === pt ? "selected" : ""}>${t("type_" + pt)}</option>`).join("")}
              </select>
            </div>
            <div class="field">
              <label>${t("checklists_title")} — ${t("template_items_hint")}</label>
              <textarea id="tpl-items" rows="6">${tpl ? tpl.items.join("\\n") : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="tpl-modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("template-modal-root").innerHTML = ""; };
    document.getElementById("tpl-modal-close").addEventListener("click", close);
    document.getElementById("tpl-modal-cancel").addEventListener("click", close);
    document.getElementById("tpl-modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "tpl-modal-backdrop") close();
    });

    document.getElementById("template-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const items = document.getElementById("tpl-items").value.split("\\n").map(s => s.trim()).filter(Boolean);
      const payload = {
        name: document.getElementById("tpl-name").value.trim(),
        checklist_type: document.getElementById("tpl-type").value,
        project_type: document.getElementById("tpl-project-type").value || null,
        items,
      };
      try {
        if (id) {
          await API.put(`/api/checklist-templates/${id}`, payload);
        } else {
          await API.post("/api/checklist-templates", payload);
        }
        close();
        showToast(t("saved"));
        await loadTemplates();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteTemplate(id) {
    if (!confirm(t("confirm_delete_template"))) return;
    try {
      await API.del(`/api/checklist-templates/${id}`);
      showToast(t("deleted"));
      await loadTemplates();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function updateSyncStatus(user) {
    const el = document.getElementById("sync-status");
    const last = user.last_synced_at ? fmtDate(user.last_synced_at.slice(0, 10)) : t("sync_never");
    const configured = user.sync_configured ? "" : ` — ${t("sync_not_configured")}`;
    el.textContent = `${t("sync_last")}: ${last}${configured}`;
  }

  async function saveSyncSettings() {
    try {
      const result = await API.post("/api/auth/sync-settings", {
        sync_remote_url: document.getElementById("sync-url").value.trim(),
        sync_token: document.getElementById("sync-token").value.trim(),
      });
      CURRENT_USER_STATE = result.user;
      updateSyncStatus(result.user);
      showToast(t("saved"));
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function runSync(direction) {
    try {
      const result = await API.post(`/api/sync/${direction}`);
      showToast(direction === "push" ? t("sync_success_push") : t("sync_success_pull"));
      const status = await API.get("/api/auth/status");
      updateSyncStatus(status.user);
    } catch (e) {
      showToast(t("sync_failed"), "error");
    }
  }

  async function exportData() {
    try {
      const data = await API.get("/api/export");
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `gdc-production-manager-export-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(t("export_success"));
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  }

  async function importData(e) {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!confirm(t("import_confirm"))) return;

    try {
      const text = await file.text();
      const payload = JSON.parse(text);
      if (!payload || (!payload.clients && !payload.projects)) {
        showToast(t("import_invalid_file"), "error");
        return;
      }
      const result = await API.post("/api/import", payload);
      showToast(tf("import_success", { clients: result.imported_clients, projects: result.imported_projects }));
    } catch (err) {
      showToast(t("import_invalid_file"), "error");
    }
  }

  requireAuth((user) => {
    renderShell("settings.html", user);
    renderPage(user);
  });
</script>
</body>
</html>

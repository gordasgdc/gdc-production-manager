<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Clients</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_CLIENTS = [];

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("clients_title")}</h1>
          <p>${t("clients_sub")}</p>
        </div>
        <button class="btn btn-primary" id="new-client-btn">+ ${t("new_client")}</button>
      </div>

      <div class="toolbar">
        <input type="text" class="search-input" id="search-input" placeholder="${t("search_clients")}">
      </div>

      <div class="list" id="clients-list"></div>
      <div id="modal-root"></div>
    `;

    document.getElementById("new-client-btn").addEventListener("click", () => openModal(null));
    document.getElementById("search-input").addEventListener("input", renderList);
  }

  function renderList() {
    const q = (document.getElementById("search-input").value || "").toLowerCase();
    let items = ALL_CLIENTS.filter(c => !q || c.name.toLowerCase().includes(q) || (c.company || "").toLowerCase().includes(q));

    const list = document.getElementById("clients-list");
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🗂️</div>
          <p><strong>${t("no_clients")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_clients_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(c => `
      <div class="row-card row-card-clickable" style="grid-template-columns: 1.6fr 1fr 1fr auto;" data-preview="${c.id}">
        <div>
          <div class="row-title">${escapeHtml(c.name)}</div>
          <div class="row-sub">${c.company ? escapeHtml(c.company) : ""}</div>
        </div>
        <div class="row-meta">${c.email ? escapeHtml(c.email) : ""}</div>
        <div class="row-meta mono">${c.project_count} ${c.project_count === 1 ? "proiect" : "proiecte"}</div>
        <div class="row-actions">
          <button class="btn btn-danger btn-sm" data-delete="${c.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    // Same Quick Preview convention as projects.html - the row itself is
    // the entry point, no separate Edit button needed on the row.
    list.querySelectorAll("[data-preview]").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".row-actions")) return;
        openPreview(Number(row.dataset.preview));
      });
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteClient(Number(btn.dataset.delete)));
    });
  }

  /// Read-only Quick Preview, same convention as projects.html - plus
  /// tel:/mailto: links so a phone/email can be acted on with one click
  /// straight from the preview, not just after opening the edit form.
  function openPreview(id) {
    const c = ALL_CLIENTS.find(x => x.id === id);
    if (!c) return;

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="preview-backdrop">
        <div class="modal" style="max-width:460px;">
          <div class="modal-header">
            <h3>${escapeHtml(c.name)}</h3>
            <button class="modal-close" id="preview-close">✕</button>
          </div>
          <div class="preview-body">
            ${c.company ? `<div class="preview-row"><strong>${t("field_company")}:</strong> ${escapeHtml(c.company)}</div>` : ""}
            ${c.email ? `<div class="preview-row"><strong>${t("field_email")}:</strong> <a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a></div>` : ""}
            ${c.phone ? `<div class="preview-row"><strong>${t("field_phone")}:</strong> <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>` : ""}
            <div class="preview-row mono">${c.project_count} ${c.project_count === 1 ? "proiect" : "proiecte"}</div>
            ${c.notes ? `<div class="preview-row"><strong>${t("field_notes")}:</strong> ${escapeHtml(c.notes)}</div>` : ""}
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" id="preview-close-2">${t("cancel")}</button>
            <button type="button" class="btn btn-primary" id="preview-edit">${t("edit")}</button>
          </div>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("preview-close").addEventListener("click", close);
    document.getElementById("preview-close-2").addEventListener("click", close);
    document.getElementById("preview-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "preview-backdrop") close();
    });
    document.getElementById("preview-edit").addEventListener("click", () => {
      close();
      openModal(id);
    });
  }

  function openModal(id) {
    const c = id ? ALL_CLIENTS.find(x => x.id === id) : null;

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal" style="max-width:460px;">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_client")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="client-form">
            <div class="field">
              <label>${t("field_name")}</label>
              <input type="text" id="f-name" required value="${c ? escapeHtml(c.name) : ""}">
            </div>
            <div class="field">
              <label>${t("field_company")}</label>
              <input type="text" id="f-company" value="${c && c.company ? escapeHtml(c.company) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_email")}</label>
                <input type="email" id="f-email" value="${c && c.email ? escapeHtml(c.email) : ""}">
              </div>
              <div class="field">
                <label>${t("field_phone")}</label>
                <input type="text" id="f-phone" value="${c && c.phone ? escapeHtml(c.phone) : ""}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes">${c && c.notes ? escapeHtml(c.notes) : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    document.getElementById("client-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("f-name").value.trim(),
        company: document.getElementById("f-company").value,
        email: document.getElementById("f-email").value,
        phone: document.getElementById("f-phone").value,
        notes: document.getElementById("f-notes").value,
      };
      try {
        if (id) {
          await API.put(`/api/clients/${id}`, payload);
        } else {
          await API.post("/api/clients", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteClient(id) {
    if (!confirm(t("confirm_delete_client"))) return;
    try {
      await API.del(`/api/clients/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  async function loadData() {
    ALL_CLIENTS = await API.get("/api/clients");
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("clients.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

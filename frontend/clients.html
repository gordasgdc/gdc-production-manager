<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Production Manager — Clients</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="translations.js"></script>
<script src="script.js"></script>
<script>
  let ALL_COMPANIES = [];
  let ALL_CLIENTS = [];
  // Most existing data is loose contacts (companies are a new concept),
  // so that's the tab people land on by default.
  let ACTIVE_TAB = "contacts";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderPage() {
    const main = document.getElementById("main-content");
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${t("clients_title")}</h1>
          <p>${t("clients_sub")}</p>
        </div>
        <button class="btn btn-primary" id="new-btn"></button>
      </div>

      <div class="pill-tabs">
        <button data-tab="contacts">${t("tab_contacts")}</button>
        <button data-tab="companies">${t("tab_companies")}</button>
      </div>

      <div class="toolbar">
        <input type="text" class="search-input" id="search-input" placeholder="">
      </div>

      <div class="list" id="list-root"></div>
      <div id="modal-root"></div>
    `;

    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => { ACTIVE_TAB = btn.dataset.tab; renderPage(); });
    });
    document.getElementById("search-input").addEventListener("input", renderList);
    updateTabChrome();
  }

  function updateTabChrome() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === ACTIVE_TAB);
    });
    const isCompanies = ACTIVE_TAB === "companies";
    document.getElementById("new-btn").textContent = "+ " + (isCompanies ? t("new_company") : t("new_client"));
    document.getElementById("new-btn").onclick = () => isCompanies ? openCompanyModal(null) : openContactModal(null);
    document.getElementById("search-input").placeholder = isCompanies ? t("search_companies") : t("search_clients");
    renderList();
  }

  function renderList() {
    if (ACTIVE_TAB === "companies") renderCompaniesList(); else renderContactsList();
  }

  // ------------------------------------------------------------ contacts --

  function renderContactsList() {
    const q = (document.getElementById("search-input").value || "").toLowerCase();
    let items = ALL_CLIENTS.filter(c =>
      !q || c.name.toLowerCase().includes(q) ||
      (c.company_name || c.company || "").toLowerCase().includes(q)
    );

    const list = document.getElementById("list-root");
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🗂️</div>
          <p><strong>${t("no_clients")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_clients_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(c => `
      <div class="row-card row-card-clickable" style="grid-template-columns: 1.6fr 1fr 1fr auto;" data-preview="${c.id}">
        <div>
          <div class="row-title">${escapeHtml(c.name)} ${flagBadgeHtml(c.is_flagged)}</div>
          <div class="row-sub">${c.company_name ? escapeHtml(c.company_name) : (c.company ? escapeHtml(c.company) : t("client_kind_" + c.kind))}${c.role ? " · " + escapeHtml(c.role) : ""}</div>
        </div>
        <div class="row-meta">${c.email ? escapeHtml(c.email) : ""}</div>
        <div class="row-meta" style="display:flex; align-items:center; gap:8px;">
          <span class="mono">${c.project_count} ${c.project_count === 1 ? "proiect" : "proiecte"}</span>
          ${payStatusPillHtml(c.payment_status)}
        </div>
        <div class="row-actions">
          <button class="btn btn-danger btn-sm" data-delete="${c.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-preview]").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".row-actions")) return;
        openContactPreview(Number(row.dataset.preview));
      });
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteClient(Number(btn.dataset.delete)));
    });
  }

  function openContactPreview(id) {
    const c = ALL_CLIENTS.find(x => x.id === id);
    if (!c) return;

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="preview-backdrop">
        <div class="modal" style="max-width:460px;">
          <div class="modal-header">
            <h3>${escapeHtml(c.name)} ${flagBadgeHtml(c.is_flagged)}</h3>
            <button class="modal-close" id="preview-close">✕</button>
          </div>
          <div class="preview-body">
            <div class="preview-row"><span class="row-sub">${t("client_kind_" + c.kind)}</span></div>
            ${c.company_name ? `<div class="preview-row"><strong>${t("field_company")}:</strong> ${escapeHtml(c.company_name)}</div>` : (c.company ? `<div class="preview-row"><strong>${t("field_company")}:</strong> ${escapeHtml(c.company)}</div>` : "")}
            ${c.role ? `<div class="preview-row"><strong>${t("field_role")}:</strong> ${escapeHtml(c.role)}</div>` : ""}
            ${c.fiscal_id ? `<div class="preview-row"><strong>${t("field_fiscal_id")}:</strong> ${escapeHtml(c.fiscal_id)}</div>` : ""}
            ${c.email ? `<div class="preview-row"><strong>${t("field_email")}:</strong> <a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a></div>` : ""}
            ${c.phone ? `<div class="preview-row"><strong>${t("field_phone")}:</strong> <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>` : ""}
            <div class="preview-row mono">${c.project_count} ${c.project_count === 1 ? "proiect" : "proiecte"} ${payStatusPillHtml(c.payment_status)}</div>
            ${c.flag_note ? `<div class="preview-row"><strong>${t("flag_badge")}:</strong> ${escapeHtml(c.flag_note)}</div>` : ""}
            ${c.notes ? `<div class="preview-row"><strong>${t("field_notes")}:</strong> ${escapeHtml(c.notes)}</div>` : ""}
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" id="preview-close-2">${t("cancel")}</button>
            <button type="button" class="btn btn-primary" id="preview-edit">${t("edit")}</button>
          </div>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("preview-close").addEventListener("click", close);
    document.getElementById("preview-close-2").addEventListener("click", close);
    document.getElementById("preview-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "preview-backdrop") close();
    });
    document.getElementById("preview-edit").addEventListener("click", () => {
      close();
      openContactModal(id);
    });
  }

  function openContactModal(id) {
    const c = id ? ALL_CLIENTS.find(x => x.id === id) : null;
    const companyOptions = `<option value="">${t("no_company")}</option>` +
      ALL_COMPANIES.map(co => `<option value="${co.id}" ${c && c.company_id === co.id ? "selected" : ""}>${escapeHtml(co.name)}</option>`).join("");

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal" style="max-width:460px;">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_client")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="client-form">
            <div class="field">
              <label>${t("field_name")}</label>
              <input type="text" id="f-name" required value="${c ? escapeHtml(c.name) : ""}">
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_client_kind")}</label>
                <select id="f-kind">
                  <option value="individual" ${!c || c.kind === "individual" ? "selected" : ""}>${t("client_kind_individual")}</option>
                  <option value="informal" ${c && c.kind === "informal" ? "selected" : ""}>${t("client_kind_informal")}</option>
                </select>
              </div>
              <div class="field">
                <label>${t("field_fiscal_id")}</label>
                <input type="text" id="f-fiscal-id" value="${c && c.fiscal_id ? escapeHtml(c.fiscal_id) : ""}">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_company")}</label>
                <select id="f-company-id">${companyOptions}</select>
              </div>
              <div class="field">
                <label>${t("field_role")}</label>
                <input type="text" id="f-role" placeholder="${t("field_role_placeholder")}" value="${c && c.role ? escapeHtml(c.role) : ""}">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>${t("field_email")}</label>
                <input type="email" id="f-email" value="${c && c.email ? escapeHtml(c.email) : ""}">
              </div>
              <div class="field">
                <label>${t("field_phone")}</label>
                <input type="text" id="f-phone" value="${c && c.phone ? escapeHtml(c.phone) : ""}">
              </div>
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes">${c && c.notes ? escapeHtml(c.notes) : ""}</textarea>
            </div>
            <div class="field">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" id="f-flagged" style="width:auto;" ${c && c.is_flagged ? "checked" : ""}>
                ${t("field_flag")}
              </label>
              <textarea id="f-flag-note" placeholder="${t("flag_note_placeholder")}" style="margin-top:6px;">${c && c.flag_note ? escapeHtml(c.flag_note) : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    document.getElementById("client-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("f-name").value.trim(),
        kind: document.getElementById("f-kind").value,
        fiscal_id: document.getElementById("f-fiscal-id").value,
        company_id: document.getElementById("f-company-id").value || null,
        role: document.getElementById("f-role").value,
        email: document.getElementById("f-email").value,
        phone: document.getElementById("f-phone").value,
        notes: document.getElementById("f-notes").value,
        is_flagged: document.getElementById("f-flagged").checked,
        flag_note: document.getElementById("f-flag-note").value,
      };
      try {
        if (id) {
          await API.put(`/api/clients/${id}`, payload);
        } else {
          await API.post("/api/clients", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteClient(id) {
    if (!confirm(t("confirm_delete_client"))) return;
    try {
      await API.del(`/api/clients/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  // ----------------------------------------------------------- companies --

  function renderCompaniesList() {
    const q = (document.getElementById("search-input").value || "").toLowerCase();
    let items = ALL_COMPANIES.filter(c => !q || c.name.toLowerCase().includes(q) || (c.cui || "").toLowerCase().includes(q));

    const list = document.getElementById("list-root");
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🏢</div>
          <p><strong>${t("no_companies")}</strong></p>
          <p style="font-size:12.5px; margin-top:4px;">${t("no_companies_hint")}</p>
        </div>`;
      return;
    }

    list.innerHTML = items.map(c => `
      <div class="row-card row-card-clickable" style="grid-template-columns: 1.6fr 1fr 1fr auto;" data-preview="${c.id}">
        <div>
          <div class="row-title">${escapeHtml(c.name)}</div>
          <div class="row-sub">${c.cui ? "CUI " + escapeHtml(c.cui) : ""}</div>
        </div>
        <div class="row-meta mono">${c.contact_count} ${c.contact_count === 1 ? "contact" : "contacte"}</div>
        <div class="row-meta">${payStatusPillHtml(c.payment_status)}</div>
        <div class="row-actions">
          <button class="btn btn-danger btn-sm" data-delete="${c.id}">${t("delete")}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-preview]").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".row-actions")) return;
        openCompanyPreview(Number(row.dataset.preview));
      });
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteCompany(Number(btn.dataset.delete)));
    });
  }

  async function openCompanyPreview(id) {
    let company;
    try {
      company = await API.get(`/api/companies/${id}`);
    } catch (e) {
      showToast(errorMessage(e), "error");
      return;
    }

    const contactsHtml = company.contacts.length
      ? company.contacts.map(ct => `
          <div class="preview-row" style="padding-left:8px; border-left:2px solid var(--border-soft);">
            <strong>${escapeHtml(ct.name)}</strong>${ct.role ? ` — ${escapeHtml(ct.role)}` : ""}
            ${ct.email ? ` · <a href="mailto:${escapeHtml(ct.email)}">${escapeHtml(ct.email)}</a>` : ""}
            ${ct.phone ? ` · <a href="tel:${escapeHtml(ct.phone)}">${escapeHtml(ct.phone)}</a>` : ""}
          </div>
        `).join("")
      : `<p style="color:var(--text-faint); font-size:12px;">${t("no_contacts_yet")}</p>`;

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="preview-backdrop">
        <div class="modal" style="max-width:520px;">
          <div class="modal-header">
            <h3>${escapeHtml(company.name)}</h3>
            <button class="modal-close" id="preview-close">✕</button>
          </div>
          <div class="preview-body">
            ${company.cui ? `<div class="preview-row"><strong>CUI:</strong> ${escapeHtml(company.cui)}</div>` : ""}
            ${company.fiscal_address ? `<div class="preview-row"><strong>${t("field_fiscal_address")}:</strong> ${escapeHtml(company.fiscal_address)} <a href="${mapsUrl(company.fiscal_address)}" target="_blank" title="${t("open_in_maps")}">📍</a></div>` : ""}
            ${company.headquarters_address ? `<div class="preview-row"><strong>${t("field_headquarters_address")}:</strong> ${escapeHtml(company.headquarters_address)} <a href="${mapsUrl(company.headquarters_address)}" target="_blank" title="${t("open_in_maps")}">📍</a></div>` : ""}
            ${company.payment_status ? `<div class="preview-row">${payStatusPillHtml(company.payment_status)}</div>` : ""}
            ${company.notes ? `<div class="preview-row"><strong>${t("field_notes")}:</strong> ${escapeHtml(company.notes)}</div>` : ""}
            <div class="preview-row" style="margin-top:6px;"><strong>${t("tab_contacts")}</strong></div>
            ${contactsHtml}
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" id="preview-revenue">${t("revenue_report")}</button>
            <button type="button" class="btn" id="preview-close-2">${t("cancel")}</button>
            <button type="button" class="btn btn-primary" id="preview-edit">${t("edit")}</button>
          </div>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("preview-close").addEventListener("click", close);
    document.getElementById("preview-close-2").addEventListener("click", close);
    document.getElementById("preview-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "preview-backdrop") close();
    });
    document.getElementById("preview-edit").addEventListener("click", () => {
      close();
      openCompanyModal(id);
    });
    document.getElementById("preview-revenue").addEventListener("click", () => {
      close();
      openRevenueModal(id);
    });
  }

  function openCompanyModal(id) {
    const c = id ? ALL_COMPANIES.find(x => x.id === id) : null;

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal" style="max-width:480px;">
          <div class="modal-header">
            <h3>${id ? t("edit") : t("new_company")}</h3>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <form id="company-form">
            <div class="field">
              <label>${t("field_name")}</label>
              <input type="text" id="f-name" required value="${c ? escapeHtml(c.name) : ""}">
            </div>
            <div class="field">
              <label>CUI</label>
              <input type="text" id="f-cui" value="${c && c.cui ? escapeHtml(c.cui) : ""}">
            </div>
            <div class="field">
              <label>${t("field_fiscal_address")}</label>
              <input type="text" id="f-fiscal-address" value="${c && c.fiscal_address ? escapeHtml(c.fiscal_address) : ""}">
            </div>
            <div class="field">
              <label>${t("field_headquarters_address")}</label>
              <input type="text" id="f-hq-address" value="${c && c.headquarters_address ? escapeHtml(c.headquarters_address) : ""}">
            </div>
            <div class="field">
              <label>${t("field_notes")}</label>
              <textarea id="f-notes">${c && c.notes ? escapeHtml(c.notes) : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="modal-cancel">${t("cancel")}</button>
              <button type="submit" class="btn btn-primary">${t("save")}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("modal-close").addEventListener("click", close);
    document.getElementById("modal-cancel").addEventListener("click", close);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") close();
    });

    document.getElementById("company-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("f-name").value.trim(),
        cui: document.getElementById("f-cui").value,
        fiscal_address: document.getElementById("f-fiscal-address").value,
        headquarters_address: document.getElementById("f-hq-address").value,
        notes: document.getElementById("f-notes").value,
      };
      try {
        if (id) {
          await API.put(`/api/companies/${id}`, payload);
        } else {
          await API.post("/api/companies", payload);
        }
        close();
        showToast(t("saved"));
        await loadData();
      } catch (err) {
        showToast(errorMessage(err), "error");
      }
    });
  }

  async function deleteCompany(id) {
    if (!confirm(t("confirm_delete_company"))) return;
    try {
      await API.del(`/api/companies/${id}`);
      showToast(t("deleted"));
      await loadData();
    } catch (err) {
      showToast(errorMessage(err), "error");
    }
  }

  // --------------------------------------------------------- revenue report

  async function openRevenueModal(companyId) {
    let data;
    try {
      data = await API.get(`/api/companies/${companyId}/revenue`);
    } catch (e) {
      showToast(errorMessage(e), "error");
      return;
    }

    const quarters = Object.keys(data.by_quarter).sort().reverse();
    const quarterRows = quarters.length
      ? quarters.map(q => {
          const perCurrency = Object.entries(data.by_quarter[q])
            .map(([cur, v]) => `${fmtMoney(v.paid, cur)} / ${fmtMoney(v.budget, cur)}`)
            .join(" · ");
          return `<div class="preview-row"><strong>${q}:</strong> ${perCurrency}</div>`;
        }).join("")
      : `<p style="color:var(--text-faint); font-size:12px;">${t("no_revenue_yet")}</p>`;

    const totalRows = Object.entries(data.totals_by_currency)
      .map(([cur, v]) => `<div class="preview-row"><strong>${cur}:</strong> ${fmtMoney(v.paid, cur)} / ${fmtMoney(v.budget, cur)}</div>`)
      .join("") || `<p style="color:var(--text-faint); font-size:12px;">${t("no_revenue_yet")}</p>`;

    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="revenue-backdrop">
        <div class="modal" style="max-width:480px;">
          <div class="modal-header">
            <h3>${t("revenue_report")} — ${escapeHtml(data.company.name)}</h3>
            <button class="modal-close" id="revenue-close">✕</button>
          </div>
          <div class="preview-body">
            <div class="preview-row mono">${data.project_count} proiecte · ${data.paid_course_count} cursuri plătite</div>
            <div class="preview-row" style="margin-top:6px;"><strong>${t("total")}</strong></div>
            ${totalRows}
            <div class="preview-row" style="margin-top:6px;"><strong>${t("by_quarter")}</strong></div>
            ${quarterRows}
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" id="revenue-close-2">${t("cancel")}</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { document.getElementById("modal-root").innerHTML = ""; };
    document.getElementById("revenue-close").addEventListener("click", close);
    document.getElementById("revenue-close-2").addEventListener("click", close);
    document.getElementById("revenue-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "revenue-backdrop") close();
    });
  }

  // -------------------------------------------------------------- shared --

  async function loadData() {
    const [companies, clients] = await Promise.all([API.get("/api/companies"), API.get("/api/clients")]);
    ALL_COMPANIES = companies;
    ALL_CLIENTS = clients;
    renderList();
  }

  requireAuth(async (user) => {
    renderShell("clients.html", user);
    renderPage();
    try {
      await loadData();
    } catch (e) {
      showToast(errorMessage(e), "error");
    }
  });
</script>
</body>
</html>

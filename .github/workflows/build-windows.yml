name: Build GDC Production Manager (Windows .exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller build/build-windows.spec --noconfirm

      - name: Pregateste folderul pentru instalator (exe + ghid PDF)
        run: |
          mkdir dist_release
          copy dist\GDCProductionManager.exe dist_release\
          copy docs\guides\Instructiuni_Utilizare.pdf dist_release\

      - name: Compileaza instalatorul (Inno Setup - preinstalat pe windows-latest)
        # AUDIT 2026-08-26 (CLAUDE.md Partea 1, Regula 5): inlocuieste
        # zip-ul "portabil" vechi (exe brut + .bat de dezinstalare) cu un
        # installer real - instalare automata in Program Files, scurtaturi
        # Start Menu + Desktop, dezinstalare nativa prin Apps & Features.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GDCProductionManager-Windows
          path: Output\GDCProductionManagerSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output\GDCProductionManagerSetup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

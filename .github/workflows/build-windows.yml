name: Build GDC Production Manager (Windows .exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller build/build-windows.spec --noconfirm

      - name: Bundle .exe + PDF guides into a single zip
        run: |
          mkdir dist_release
          copy dist\GDCProductionManager.exe dist_release\
          copy docs\guides\*.pdf dist_release\
          Compress-Archive -Path "dist_release\*" -DestinationPath "GDCProductionManager-windows.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GDCProductionManager-Windows
          path: GDCProductionManager-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GDCProductionManager-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

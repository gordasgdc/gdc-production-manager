name: Build GDC Production Manager (Mac .app + .pkg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Apple certificates
        env:
          APPLE_CERT_APP_P12_BASE64: ${{ secrets.APPLE_CERT_APP_P12_BASE64 }}
          APPLE_CERT_APP_P12_PASSWORD: ${{ secrets.APPLE_CERT_APP_P12_PASSWORD }}
          APPLE_CERT_INSTALLER_P12_BASE64: ${{ secrets.APPLE_CERT_INSTALLER_P12_BASE64 }}
          APPLE_CERT_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_CERT_INSTALLER_P12_PASSWORD }}
        run: ./codesigning/ci-import-certs.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .app with PyInstaller
        run: |
          pyinstaller build/build-mac.spec --noconfirm

      - name: Sign + notarize .app
        env:
          APPLE_SIGN_IDENTITY_APP: ${{ secrets.APPLE_SIGN_IDENTITY_APP }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: ./codesigning/sign-and-notarize.sh app dist/GDCProductionManager.app

      - name: Create .pkg installer
        env:
          APPLE_SIGN_IDENTITY_INSTALLER: ${{ secrets.APPLE_SIGN_IDENTITY_INSTALLER }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg_root/Applications
          cp -R dist/GDCProductionManager.app pkg_root/Applications/
          # --sign doar daca certificatul Installer e configurat (secret
          # setat) - altfel pkgbuild ar primi --sign "" si ar da eroare.
          SIGN_ARGS=()
          if [ -n "$APPLE_SIGN_IDENTITY_INSTALLER" ]; then
            SIGN_ARGS=(--sign "$APPLE_SIGN_IDENTITY_INSTALLER")
          fi
          # --scripts: preinstall CURATA doar o instalare veche ramasa
          # (pkill + rm -rf pe copia veche, inclusiv calea gresita
          # /Applications/Applications/ din bug-ul <= v1.1.5). NU contine
          # niciun hack de Gatekeeper/quarantine - pachetul e stapled mai
          # jos, deci Gatekeeper il accepta nativ (vezi CLAUDE.md, 2026-08-25).
          pkgbuild \
            --root pkg_root \
            --identifier com.gordasgdc.productionmanager \
            --version "${VERSION:-1.0.0}" \
            --install-location / \
            --scripts installer/scripts \
            "${SIGN_ARGS[@]}" \
            GDCProductionManager.pkg

      - name: Notarize .pkg
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [ -n "$APPLE_NOTARY_APPLE_ID" ]; then
            xcrun notarytool submit GDCProductionManager.pkg --apple-id "$APPLE_NOTARY_APPLE_ID" --team-id "$APPLE_NOTARY_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" --wait
            xcrun stapler staple GDCProductionManager.pkg
          fi

      - name: Bundle .pkg + PDF guides + uninstaller into a single zip
        run: |
          # Pachetul e semnat + notarizat + stapled (pasii de mai sus),
          # deci Gatekeeper il accepta nativ - NU mai exista niciun
          # launcher/script de bypass (Instalare_GDCProductionManager.command,
          # eliminat 2026-08-25). Totul la radacina arhivei, fara subfoldere.
          mkdir -p mac_bundle
          cp GDCProductionManager.pkg mac_bundle/
          cp docs/guides/*.pdf mac_bundle/ 2>/dev/null || true
          cp uninstall/uninstall-mac.command mac_bundle/Dezinstalare_GDCProductionManager.command
          chmod +x mac_bundle/Dezinstalare_GDCProductionManager.command
          cd mac_bundle
          zip -r -y ../GDCProductionManager-mac.zip .
          cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GDCProductionManager-Mac
          path: GDCProductionManager-mac.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GDCProductionManager-mac.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

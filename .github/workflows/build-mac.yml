name: Build GDC Production Manager (Mac .app + .pkg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .app with PyInstaller
        run: |
          pyinstaller build/build-mac.spec --noconfirm

      - name: Zip the .app for distribution
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GDCProductionManager.app GDCProductionManager-mac.zip
          cd ..

      - name: Create .pkg installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg_root/Applications
          cp -R dist/GDCProductionManager.app pkg_root/Applications/
          pkgbuild \
            --root pkg_root \
            --identifier com.gordasgdc.productionmanager \
            --version "${VERSION:-1.0.0}" \
            --install-location /Applications \
            GDCProductionManager.pkg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GDCProductionManager-Mac
          path: |
            dist/GDCProductionManager-mac.zip
            GDCProductionManager.pkg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GDCProductionManager-mac.zip
            GDCProductionManager.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
